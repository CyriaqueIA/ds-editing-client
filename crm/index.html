<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>DS Editing — CRM</title>
<link rel="icon" type="image/png" href="../assets/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet"/>
<style>
/* CRM DS Editing — tranche 1 : fiches, tunnel, chronologie. Tous les onglets de la maquette validée le 30/09/2026 sont affichés ; Mailing et Bot restent à construire. */
:root{
  --bg:#FCFCFB; --surface:#F2F4F5; --surface-2:#E8EBEE; --line:rgba(12,22,34,.12); --line-strong:rgba(12,22,34,.28);
  --fg:#0B0D10; --muted:#5A6570; --accent:#24466F; --accent-soft:rgba(36,70,111,.10);
  --ok:#1E8A45; --warn:#9A6B00; --err:#C2413A; --btn-fg:#FCFCFB; --shade:rgba(8,12,18,.45);
  --font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#050607; --surface:#0F1114; --surface-2:#161A1F; --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.24);
    --fg:#F5F5F1; --muted:#9AA3AD; --accent:#B9C9DA; --accent-soft:rgba(185,201,218,.12);
    --ok:#46D369; --warn:#F5C400; --err:#F08A82; --btn-fg:#0A0B0D; --shade:rgba(0,0,0,.6); color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:1240px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.03em;font-size:20px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.brand em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.who b{color:var(--fg);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.muted{color:var(--muted)} .small{font-size:13px}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{font-size:13.5px;font-weight:600;border-radius:999px;padding:7px 14px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--fg);color:var(--btn-fg);border-color:var(--fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);padding:8px 11px;font-size:14px;min-width:0}
textarea.field{width:100%;min-height:74px;resize:vertical}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line-strong);white-space:nowrap;display:inline-block}
.pill.late{color:var(--err);border-color:var(--err)}
.pill.today{color:var(--warn);border-color:var(--warn)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.ro{font-size:13px;color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 12px}

/* connexion */
#login{max-width:380px;margin:12vh auto 0;padding:0 16px;display:flex;flex-direction:column;gap:14px}
#login form{display:flex;flex-direction:column;gap:10px}
#login label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
#loginMsg{font-size:13.5px;color:var(--err);min-height:20px}

/* fiches */
.vh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.vh h2{font-size:22px;font-weight:600;letter-spacing:-.03em}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .field{padding:7px 10px;font-size:13.5px}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.count{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:120px}
.count[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.count b{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.count span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface)}
td.nw{white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:12.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{all:unset;cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline;text-underline-offset:2px}

/* tunnel */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:999px;padding:3px;gap:2px}
.seg button{font-size:13.5px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--btn-fg)}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 190px;background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.col h3 span{color:var(--muted);font-variant-numeric:tabular-nums}
.kcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.kcard:hover{border-color:var(--line-strong)}
.kcard b{font-weight:600;overflow-wrap:anywhere}
.kcard small{color:var(--muted);font-size:12px}
.kcard small.late{color:var(--err);font-weight:600}
.more{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);text-align:center;padding:4px}

/* fiche */
#overlay{position:fixed;inset:0;background:var(--shade);display:flex;justify-content:flex-end;z-index:10}
#drawer{background:var(--bg);width:min(620px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--line-strong)}
.fiche{padding:14px 18px 40px;display:flex;flex-direction:column;gap:16px}
.fh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.fh h2{font-size:22px;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.fh select{border:1px solid var(--line-strong);border-radius:999px;background:var(--bg);padding:6px 10px;font-size:13px;font-weight:600}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px;font-size:13.5px}
.meta div{min-width:0;overflow-wrap:anywhere}
.meta span{display:block;color:var(--muted);font-size:12px}
.people{display:flex;flex-direction:column;gap:8px}
.person{background:var(--surface);border-radius:10px;padding:9px 12px;font-size:13.5px;overflow-wrap:anywhere}
.person b{font-weight:600}
.box{border:1px solid var(--line-strong);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rowf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rowf .grow{flex:1 1 220px}
.ctx{font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.ctx p{white-space:pre-line}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.tl li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.tl .body{color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.tl .body.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--btn-fg);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;max-width:min(520px,calc(100% - 32px));z-index:20}
.empty{padding:26px 14px;color:var(--muted);font-size:14px;text-align:center}
/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:460px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile .s{font-size:12px;color:var(--muted);min-height:18px}
.tiles.big .v{font-size:clamp(34px,5vw,52px)}
.tiles.big .tile{padding:18px}
/* ma journée */
.day{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.day{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--bg);min-width:0}
.panel > .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.qgroup{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px;border-top:1px solid var(--line)}
.qgroup:first-child{border-top:0}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;border-top:1px solid var(--line)}
.qrow.sel{background:var(--accent-soft)}
.qmain{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 6px 9px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;min-width:0}
.qmain b{font-weight:600;overflow-wrap:anywhere}
.qmain small{grid-column:1/-1;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpin{border:1px solid transparent;background:transparent;border-radius:8px;height:28px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;padding:0 8px;margin:8px 8px 0 0}
.qpin:hover{border-color:var(--line-strong);color:var(--fg)}
.qpin.on{color:var(--accent);border-color:var(--accent)}
.soon{border:1px dashed var(--line-strong);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.soon ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hint{font-size:13px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:10px}
</style>
</head>
<body>

<section id="login" hidden>
  <span class="brand"><i></i>DS<em>Editing CRM</em></span>
  <h1 style="font-size:26px;font-weight:600;letter-spacing:-.03em">Connexion</h1>
  <form id="loginForm">
    <label>E-mail<input class="field" type="email" id="email" autocomplete="username" required/></label>
    <label>Mot de passe<input class="field" type="password" id="password" autocomplete="current-password" required/></label>
    <button class="btn pri" type="submit" id="loginBtn">Se connecter</button>
    <p id="loginMsg" role="alert"></p>
  </form>
</section>

<div class="shell" id="app" hidden>
  <div class="top">
    <span class="brand"><i></i>DS<em>Editing CRM</em></span>
    <div class="who"><span id="whoami"></span><button class="btn" type="button" id="logout">Se déconnecter</button></div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <main id="view"></main>
</div>
<div id="overlay" hidden><div id="drawer" role="dialog" aria-label="Fiche"></div></div>
<div id="toast" role="status" hidden></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://xkanmjlpysxpohsuqvwg.supabase.co";
const SUPABASE_ANON = "sb_publishable_lIZtV_WtN5NcGSb0dnfaiQ_AgKYBIVa";
const HUBSPOT_COMPANY = "https://app-na2.hubspot.com/contacts/247385305/record/0-2/";

const STAGES = [["a_contacter", "À contacter"], ["contacte", "Contacté"], ["en_conversation", "En conversation"], ["rdv_pris", "RDV pris"], ["visio_faite", "Visio faite"], ["test_en_cours", "Test en cours"], ["test_livre", "Test livré"], ["gagne", "Gagné"], ["perdu", "Perdu"], ["ecarte", "Écarté"]];
const STAGE_LABEL = Object.fromEntries(STAGES);
const OPEN = STAGES.slice(0, 7).map((s) => s[0]);
const MARKET = { france_metropole: "France", usa: "USA", quebec: "Québec", uk: "UK", antilles_guyane: "Antilles-Guyane", suisse: "Suisse", belgique: "Belgique", luxembourg: "Luxembourg", acadie_n_b: "Acadie", pays_bas: "Pays-Bas", autre: "Autre" };
const TYPE = { studio_podcast: "Studio podcast", agence_smm_contenu: "Agence contenu", agence_video_production: "Agence vidéo", createur_media: "Créateur / média", formateur_coach: "Formateur / coach", autre: "Autre" };
const KIND = { call: "Appel", email: "Mail", message: "Message", note: "Note", task: "Tâche", meeting: "Rendez-vous", stage: "Étape", assistant: "Assistant" };
const TABS = [["jour", "Ma journée"], ["fiches", "Fiches"], ["tunnel", "Tunnel"], ["clients", "Clients"], ["mail", "Mailing"], ["chiffres", "Chiffres"], ["bot", "Bot et alertes"], ["tele", "Mode télé"]];
const VIEWER_TABS = ["fiches", "tunnel", "clients", "chiffres", "tele"];
const PROSPECTING = ["a_contacter", "contacte", "en_conversation"], CLOSING = ["rdv_pris", "visio_faite", "test_en_cours", "test_livre"];
const CLIENT_STATUS = { client_actif: "Actif", en_pause: "En pause", perdu: "Perdu", test_livre: "Test livré", prospect: "Prospect" };

const $ = (id) => document.getElementById(id);
function h(tag, a, kids) {
  const e = document.createElement(tag);
  if (a) for (const k in a) { const v = a[k]; if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v; else e.setAttribute(k, v === true ? "" : v); }
  (kids || []).forEach((c) => { if (c == null || c === false) return; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
const p2 = (n) => String(n).padStart(2, "0");
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : "");
function todayIso() { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; }
function dayDiff(iso) { const [y, m, d] = iso.split("-").map(Number), [ty, tm, td] = todayIso().split("-").map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ty, tm - 1, td)) / 864e5); }
function frDate(iso) { if (!iso) return ""; const d = iso.length === 10 ? iso.split("-") : null; if (d) return `${d[2]}/${d[1]}/${d[0]}`; const x = new Date(iso); return `${p2(x.getDate())}/${p2(x.getMonth() + 1)}/${x.getFullYear()}`; }
function rel(iso) { const n = dayDiff(iso); if (n < 0) return `En retard de ${-n} j`; if (n === 0) return "Aujourd'hui"; if (n === 1) return "Demain"; return `Le ${frDate(iso).slice(0, 5)}`; }
function relClass(iso) { const n = dayDiff(iso); return n < 0 ? "late" : n === 0 ? "today" : ""; }
let toastTimer = null;
function toast(x) { const t = $("toast"); t.textContent = x; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800); }

let sb = null;
const S = { me: null, members: [], deals: [], contacts: new Map(), tab: "fiches", q: "", stage: "open", market: "", setter: "", quick: "", mine: false, open: null, acts: null, more: {}, busy: false, note: "", sel: null, actsFor: null, week: [], jourMore: {} };
const canEdit = () => S.me && (S.me.role === "admin" || S.me.role === "sales");
const isOpen = (d) => OPEN.includes(d.stage);
const ownerName = (d) => (S.members.find((m) => m.user_id === d.owner_id)?.display_name) || cap(d.setter) || "Non attribué";
const byId = (id) => S.deals.find((d) => d.id === id);

/* ---------- données ---------- */
async function load() {
  const [deals, contacts, members, week] = await Promise.all([
    sb.from("crm_deals").select("*, company:crm_companies(*)").order("created_at", { ascending: true }).limit(2000),
    sb.from("crm_contacts").select("*").limit(5000),
    sb.from("crm_members").select("*"),
    loadWeek(),
  ]);
  const err = deals.error || contacts.error || members.error;
  if (err) throw err;
  S.deals = deals.data; S.members = members.data; S.week = week;
  S.contacts = new Map();
  for (const c of contacts.data) { if (!S.contacts.has(c.company_id)) S.contacts.set(c.company_id, []); S.contacts.get(c.company_id).push(c); }
}
function monday() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
async function loadWeek() {
  const { data, error } = await sb.from("crm_activities").select("kind,outcome,subject,author_id,occurred_at").in("kind", ["call", "stage"]).gte("occurred_at", monday().toISOString()).limit(5000);
  if (error) throw error;
  return data;
}
function stats(userId) {
  const rows = userId ? S.week.filter((a) => a.author_id === userId) : S.week, to = (k) => rows.filter((a) => a.kind === "stage" && (a.subject || "").endsWith("> " + k)).length;
  const calls = rows.filter((a) => a.kind === "call");
  return { a: calls.length, d: calls.filter((a) => a.outcome === "Décroché").length, r: to("rdv_pris"), v: to("visio_faite"), t: to("test_en_cours"), g: to("gagne") };
}
function ensureActs(id) {
  if (S.actsFor === id) return;
  S.actsFor = id; S.acts = null;
  loadActs(byId(id)).then((a) => { if (S.actsFor === id) { S.acts = a; render(); } }).catch((e) => toast("Chronologie indisponible : " + (e.message || e)));
}
async function loadActs(d) {
  const { data, error } = await sb.from("crm_activities").select("*").or(`deal_id.eq.${d.id},company_id.eq.${d.company_id}`).order("occurred_at", { ascending: false }).limit(500);
  if (error) throw error;
  return data;
}
async function patchDeal(id, patch, okMsg) {
  if (S.busy) return; S.busy = true;
  try {
    const { data, error } = await sb.from("crm_deals").update(patch).eq("id", id).select("*, company:crm_companies(*)").single();
    if (error) throw error;
    S.deals[S.deals.findIndex((d) => d.id === id)] = data;
    if (S.actsFor === id) S.acts = await loadActs(data);
    if (patch.stage) S.week = await loadWeek();
    toast(okMsg);
  } catch (e) { toast("Enregistrement impossible : " + (e.message || e)); }
  S.busy = false; render();
}
async function addNote(d, body) {
  if (S.busy) return; S.busy = true;
  try {
    const { error } = await sb.from("crm_activities").insert({ deal_id: d.id, company_id: d.company_id, kind: "note", body, author_id: S.me.user_id, author_label: S.me.display_name });
    if (error) throw error;
    S.note = ""; S.acts = await loadActs(d); toast("Note ajoutée à la chronologie.");
  } catch (e) { toast("Note non enregistrée : " + (e.message || e)); }
  S.busy = false; render();
}

/* ---------- filtres ---------- */
function filtered() {
  const q = S.q.trim().toLowerCase();
  return S.deals.filter((d) => {
    if (S.stage === "open" ? !isOpen(d) : S.stage && d.stage !== S.stage) return false;
    if (S.market && d.company.market !== S.market) return false;
    if (S.setter && (d.setter || "") !== S.setter) return false;
    if (S.quick === "late" && !(d.next_action_at && dayDiff(d.next_action_at) < 0)) return false;

const SOON = {
  mail: ["Mailing", "Tranche 4", ["Envoi depuis la boîte @ds-editing.com de chacun.", "Séquence de 3 mails (J0, J+3, J+7), arrêtée dès que le prospect répond.", "Réponses lues dans Outlook et copiées dans la fiche.", "Suivi des clics seulement."], "Il faut d'abord la boîte de Ghali."],
  bot: ["Bot et alertes", "Tranche 5", ["Un bot Telegram par personne.", "Tout par réponses toutes prêtes : Fait, Reporter, Ouvrir la fiche, Ma file du jour, Mes relances en retard, Mes chiffres, Ajouter une note.", "Les 7 alertes, à toute heure."], "Il faut Telegram installé sur ton téléphone et celui de Ghali."],
};
function vSoon(key) {
  const [title, when, items, need] = SOON[key];
  return h("div", { style: "display:flex;flex-direction:column;gap:14px" }, [
    h("div", { class: "vh" }, [h("h2", { text: title }), h("span", { class: "pill today", text: "Pas encore construit · " + when })]),
    h("div", { class: "soon" }, [h("b", { text: "Ce que fera cet onglet" }), h("ul", null, items.map((x) => h("li", { text: x }))), h("p", { class: "muted small", text: need })]),
  ]);
}
const VIEWS = { jour: vJour, fiches: vFiches, tunnel: vTunnel, clients: vClients, mail: () => vSoon("mail"), chiffres: vChiffres, bot: () => vSoon("bot"), tele: vTele };

function render() {
  const tb = $("tabs"); tb.textContent = "";
  const tabs = S.me.role === "viewer" ? TABS.filter(([k]) => VIEWER_TABS.includes(k)) : TABS;
  if (!tabs.some(([k]) => k === S.tab)) S.tab = tabs[0][0];
  tabs.forEach(([k, l]) => tb.appendChild(h("button", { type: "button", role: "tab", "aria-selected": String(S.tab === k), onclick: () => { S.tab = k; S.note = ""; render(); } }, [l])));
  const v = $("view"); v.textContent = "";
  v.appendChild(VIEWS[S.tab]());
  const ov = $("overlay"), dr = $("drawer");
  if (S.open && byId(S.open)) {
    const top = dr.scrollTop;
    dr.textContent = ""; dr.appendChild(fiche(byId(S.open))); ov.hidden = false; dr.scrollTop = top;
  } else { ov.hidden = true; dr.textContent = ""; }
}

/* ---------- session ---------- */
async function boot(user) {
  const { data, error } = await sb.from("crm_members").select("*");
  const me = !error && data ? data.find((m) => m.user_id === user.id && m.active) : null;
  if (!me) {
    await sb.auth.signOut(); $("app").hidden = true; $("login").hidden = false;
    $("loginMsg").textContent = "Ce compte n'a pas accès au CRM. Demande l'accès à Cyriaque."; return;
  }
  S.me = me; S.tab = me.role === "viewer" ? "fiches" : "jour"; S.sel = null; S.open = null; S.actsFor = null;
  $("login").hidden = true; $("app").hidden = false;
  const who = $("whoami"); who.textContent = "";
  who.appendChild(h("b", { text: me.display_name })); who.appendChild(document.createTextNode(me.role === "viewer" ? " · lecture seule" : me.role === "admin" ? " · admin" : ""));
  $("view").textContent = ""; $("view").appendChild(h("div", { class: "empty", text: "Chargement des fiches…" }));
  try { await load(); render(); } catch (e) { $("view").textContent = ""; $("view").appendChild(h("div", { class: "empty", text: "Chargement impossible : " + (e.message || e) })); }
}
async function init() {
  sb = createClient(SUPABASE_URL, SUPABASE_ANON);
  $("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault(); $("loginMsg").textContent = ""; $("loginBtn").disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    $("loginBtn").disabled = false;
    if (error) { $("loginMsg").textContent = "E-mail ou mot de passe incorrect."; return; }
    $("password").value = ""; boot(data.user);
  });
  $("logout").addEventListener("click", async () => { await sb.auth.signOut(); S.me = null; S.open = null; $("app").hidden = true; $("overlay").hidden = true; $("login").hidden = false; });
  $("overlay").addEventListener("click", (ev) => { if (ev.target === $("overlay")) closeFiche(); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && S.open) closeFiche(); });
  const { data } = await sb.auth.getSession();
  if (data.session) boot(data.session.user); else $("login").hidden = false;
}
init();
</script>
</body>
</html>
