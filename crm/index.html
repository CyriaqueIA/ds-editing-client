<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>DS Editing — CRM</title>
<link rel="icon" type="image/png" href="../assets/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet"/>
<style>
/* CRM DS Editing — tranche 1 : fiches, tunnel, chronologie. Tous les onglets de la maquette validée le 30/09/2026 sont affichés ; Mailing et Bot restent à construire. */
:root{
  --bg:#FCFCFB; --surface:#F2F4F5; --surface-2:#E8EBEE; --line:rgba(12,22,34,.12); --line-strong:rgba(12,22,34,.28);
  --fg:#0B0D10; --muted:#5A6570; --accent:#24466F; --accent-soft:rgba(36,70,111,.10);
  --ok:#1E8A45; --warn:#9A6B00; --err:#C2413A; --btn-fg:#FCFCFB; --shade:rgba(8,12,18,.45);
  --font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#050607; --surface:#0F1114; --surface-2:#161A1F; --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.24);
    --fg:#F5F5F1; --muted:#9AA3AD; --accent:#B9C9DA; --accent-soft:rgba(185,201,218,.12);
    --ok:#46D369; --warn:#F5C400; --err:#F08A82; --btn-fg:#0A0B0D; --shade:rgba(0,0,0,.6); color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:1240px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.03em;font-size:20px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.brand em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.who b{color:var(--fg);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.muted{color:var(--muted)} .small{font-size:13px}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{font-size:13.5px;font-weight:600;border-radius:999px;padding:7px 14px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--fg);color:var(--btn-fg);border-color:var(--fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);padding:8px 11px;font-size:14px;min-width:0}
textarea.field{width:100%;min-height:74px;resize:vertical}
/* height:fit-content = verrou : une pastille ne doit JAMAIS s'étirer sur la hauteur de son conteneur (grille ou flex),
   sinon le border-radius:999px la transforme en ovale. Ne change aucun alignement existant. */
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line-strong);white-space:nowrap;display:inline-block;height:fit-content}
.pill.late{color:var(--err);border-color:var(--err)}
.pill.today{color:var(--warn);border-color:var(--warn)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.ro{font-size:13px;color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 12px}

/* connexion */
#login{max-width:380px;margin:12vh auto 0;padding:0 16px;display:flex;flex-direction:column;gap:14px}
#login form{display:flex;flex-direction:column;gap:10px}
#login label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
#loginMsg{font-size:13.5px;color:var(--err);min-height:20px}

/* fiches */
.vh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.vh h2{font-size:22px;font-weight:600;letter-spacing:-.03em}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .field{padding:7px 10px;font-size:13.5px}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.count{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:120px}
.count[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.count b{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.count span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface)}
td.nw{white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:12.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{all:unset;cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline;text-underline-offset:2px}

/* tunnel */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:999px;padding:3px;gap:2px}
.seg button{font-size:13.5px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--btn-fg)}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 190px;background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.col h3 span{color:var(--muted);font-variant-numeric:tabular-nums}
.kcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.kcard:hover{border-color:var(--line-strong)}
.kcard b{font-weight:600;overflow-wrap:anywhere}
.kcard small{color:var(--muted);font-size:12px}
.kcard small.late{color:var(--err);font-weight:600}
.more{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);text-align:center;padding:4px}

/* fiche */
#overlay{position:fixed;inset:0;background:var(--shade);display:flex;justify-content:flex-end;z-index:10}
#drawer{background:var(--bg);width:min(620px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--line-strong)}
.fiche{padding:14px 18px 40px;display:flex;flex-direction:column;gap:16px}
.fh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.fh h2{font-size:22px;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.fh select{border:1px solid var(--line-strong);border-radius:999px;background:var(--bg);padding:6px 10px;font-size:13px;font-weight:600}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px;font-size:13.5px}
.meta div{min-width:0;overflow-wrap:anywhere}
.meta span{display:block;color:var(--muted);font-size:12px}
.people{display:flex;flex-direction:column;gap:8px}
.person{background:var(--surface);border-radius:10px;padding:9px 12px;font-size:13.5px;overflow-wrap:anywhere}
.person b{font-weight:600}
.person{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.person .pedit{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);flex:none;padding:2px 0}
.person .pedit:focus-visible,.addc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.addc{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);padding:4px 0;align-self:flex-start}
@media (max-width:460px){.nf.ce{grid-template-columns:1fr}}
.box{border:1px solid var(--line-strong);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
/* nouvelle fiche (setters) */
.nf{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.nf label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.nf label.w{grid-column:1 / -1}
.nf .field{width:100%}
.nf .seg{display:flex;gap:4px}
.nf .seg button{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.nf .seg button[aria-pressed="true"]{background:var(--fg);color:var(--btn-fg);border-color:var(--fg)}
.dup{font-size:13px;color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.rowf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rowf .grow{flex:1 1 220px}
.ctx{font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.ctx p{white-space:pre-line}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.tl li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.tl .body{color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.tl .body.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--btn-fg);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;max-width:min(520px,calc(100% - 32px));z-index:20}
.empty{padding:26px 14px;color:var(--muted);font-size:14px;text-align:center}
/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:460px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile .s{font-size:12px;color:var(--muted);min-height:18px}
.tiles.big .v{font-size:clamp(34px,5vw,52px)}
.tiles.big .tile{padding:18px}
/* ma journée */
.day{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.day{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--bg);min-width:0}
.panel > .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.qgroup{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px;border-top:1px solid var(--line)}
.qgroup:first-child{border-top:0}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;border-top:1px solid var(--line)}
.qrow.sel{background:var(--accent-soft)}
/* align-items:start est OBLIGATOIRE : sans lui, les enfants de cette grille s'étirent sur la hauteur de la ligne.
   Dès qu'un nom de société passe sur 2 lignes, la pastille « En retard de X j » (border-radius:999px) devient un gros ovale. */
.qmain{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 6px 9px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;min-width:0;align-items:start}
.qmain b{font-weight:600;overflow-wrap:anywhere}
.qmain small{grid-column:1/-1;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpin{border:1px solid transparent;background:transparent;border-radius:8px;height:28px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;padding:0 8px;margin:8px 8px 0 0}
.qpin:hover{border-color:var(--line-strong);color:var(--fg)}
.qpin.on{color:var(--accent);border-color:var(--accent)}
.soon{border:1px dashed var(--line-strong);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.soon ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hint{font-size:13px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:10px}
/* recherche globale (30/10) : en-tête, tous les onglets, toutes les étapes */
.gs{position:relative;flex:1 1 320px;max-width:520px;min-width:0}
.gs input{width:100%;border-radius:999px;padding:8px 40px 8px 14px}
.gs kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11.5px var(--font);color:var(--muted);border:1px solid var(--line-strong);border-radius:6px;padding:0 6px;pointer-events:none}
.gs input:focus ~ kbd,.gs input:not(:placeholder-shown) ~ kbd{display:none}
.gs-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--bg);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:min(70vh,560px);overflow-y:auto;z-index:15;padding:4px 0}
.gs-res .qgroup{border-top:1px solid var(--line)}
.gs-res .qgroup:first-child{border-top:0}
.gs-item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:start;width:100%;padding:8px 14px;font-size:13.5px}
.gs-item[aria-selected="true"],.gs-item:hover{background:var(--accent-soft)}
.gs-item b{font-weight:600;overflow-wrap:anywhere}
.gs-item small{grid-column:1/-1;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-item mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.gs-foot{font-size:12.5px;color:var(--muted);padding:8px 14px}
/* langue (23/11) : bouton FR / EN en haut à droite ; compte « CRM seul » = pas de menu Espaces (nav.js) */
.who .seg{padding:2px}
.who .seg button{padding:4px 10px;font-size:12px}
body.crm-only .dsnav{display:none!important}
</style>
</head>
<body>

<section id="login" hidden>
  <span class="brand"><i></i>DS<em>Editing CRM</em></span>
  <h1 id="loginTitle" style="font-size:26px;font-weight:600;letter-spacing:-.03em">Connexion</h1>
  <form id="loginForm">
    <label><span id="lEmail">E-mail</span><input class="field" type="email" id="email" autocomplete="username" required/></label>
    <label><span id="lPass">Mot de passe</span><input class="field" type="password" id="password" autocomplete="current-password" required/></label>
    <button class="btn pri" type="submit" id="loginBtn">Se connecter</button>
    <p id="loginMsg" role="alert"></p>
  </form>
</section>

<div class="shell" id="app" hidden>
  <div class="top">
    <span class="brand"><i></i>DS<em>Editing CRM</em></span>
    <div class="gs" id="gs">
      <input class="field" type="search" id="gsInput" placeholder="Rechercher : société, contact, téléphone, site, note…" aria-label="Rechercher dans tout le CRM" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gsRes"/>
      <kbd>/</kbd>
      <div class="gs-res" id="gsRes" role="listbox" hidden></div>
    </div>
    <div class="who"><span id="whoami"></span><div class="seg" id="langSeg" role="group" aria-label="Langue / Language"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button></div><button class="btn" type="button" id="logout" hidden>Se déconnecter</button><a class="btn" id="notYou" href="?login=1" hidden>Ce n'est pas vous ?</a></div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <main id="view"></main>
</div>
<div id="overlay" hidden><div id="drawer" role="dialog" aria-label="Fiche"></div></div>
<div id="toast" role="status" hidden></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ATTENTION : si cet e-mail change, changer AUSSI la fonction crm_is_open_access() côté base (sinon le garde-fou « compte partagé » de crm_team_week() et des policies ne reconnaît plus le compte et le trou se rouvre en silence).
const OPEN_ACCESS = null; // 14/10 : accès libre FERMÉ (liens magiques ?p= distribués aux 5 + télé). Pour le rouvrir un jour : remettre { email, password } du compte partagé et lever son bannissement en base.
const SUPABASE_URL = "https://xkanmjlpysxpohsuqvwg.supabase.co";
const SUPABASE_ANON = "sb_publishable_lIZtV_WtN5NcGSb0dnfaiQ_AgKYBIVa";
const HUBSPOT_COMPANY = "https://app-na2.hubspot.com/contacts/247385305/record/0-2/";

/* ---------- langue (23/11/2026) : FR par défaut, EN pour les sales US ----------
   Tous les textes de l'interface passent par T("français", "english"), lu au moment de l'affichage.
   Choix de la langue : ?lang=en|fr dans l'adresse → bouton FR / EN (gardé dans ce navigateur, par compte) → EN_MEMBERS → FR.
   Nouveau sales US : ajouter son user_id (crm_members) dans EN_MEMBERS, et dans CRM_ONLY s'il ne doit voir que le CRM.
   Les données tapées par l'équipe (notes, prochaines actions, contexte des fiches) restent dans la langue où on les a écrites.
   CRM_ONLY : comptes qui ne voient que le CRM (pas de menu « Espaces » vers la production, les entretiens…). Ce n'est pas une
   barrière de sécurité (chaque page garde ses droits), juste pour ne pas montrer des portes inutiles. */
// Par identifiant de compte (crm_members.user_id), jamais par e-mail : cette page est publique.
const EN_MEMBERS = ["89ca1105-dc87-4061-a598-e670cbf61762"];   // Arvada (sales US)
const CRM_ONLY = ["89ca1105-dc87-4061-a598-e670cbf61762"];     // Arvada
const QS = new URLSearchParams(location.search);
const QS_LANG = ["fr", "en"].includes((QS.get("lang") || "").toLowerCase()) ? QS.get("lang").toLowerCase() : null;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* navigation privée : la langue n'est pas gardée */ } }
const savedLang = (uid) => { const v = lsGet("crm_lang:" + uid); return v === "fr" || v === "en" ? v : null; };
const defaultLang = (uid) => (EN_MEMBERS.includes(uid) ? "en" : "fr");
let LANG = QS_LANG || (lsGet("crm_lang:last") === "en" ? "en" : "fr");   // avant la connexion : dernière langue utilisée dans ce navigateur
const T = (fr, en) => (LANG === "en" ? en : fr);
const sEn = (n) =>   // « s » du pluriel : français n > 1, anglais n ≠ 1 (0 leads, 1 lead, 2 leads)
   (LANG === "en" ? (n === 1 ? "" : "s") : n > 1 ? "s" : "");

const OPEN = ["a_contacter", "contacte", "en_conversation", "rdv_pris", "visio_faite", "test_en_cours", "test_livre"];
let STAGES, STAGE_LABEL, MARKET, TYPE, KIND, TABS, CLIENT_STATUS, OUTCOME;
function buildLabels() {
  STAGES = [["a_contacter", T("À contacter", "To contact")], ["contacte", T("Contacté", "Contacted")], ["en_conversation", T("En conversation", "In conversation")], ["rdv_pris", T("RDV pris", "Meeting booked")], ["visio_faite", T("Visio faite", "Video call done")], ["test_en_cours", T("Test en cours", "Test in progress")], ["test_livre", T("Test livré", "Test delivered")], ["gagne", T("Gagné", "Won")], ["perdu", T("Perdu", "Lost")], ["ecarte", T("Écarté", "Disqualified")]];

/* ---------- contacts d'une fiche : ajouter / modifier (12/11) ----------
   Policies crm_v1 : insert et update de crm_contacts ouverts à admin/sales. Le téléphone est enregistré au format
   international (+33…) quand on sait le lire : le webhook Onoff compare les 9 derniers chiffres (crm_phone_key),

   Sinon : un 06 / 07 à 10 chiffres = mobile français (+33) ; tout le reste est gardé tel quel. */
const LOCAL = {
  "33": /^0[1-9]\d{8}$/,                       // FR : 0 + 9 chiffres
  "32": /^0(?:4\d{8}|[1-9]\d{7})$/,            // BE : mobile 04 + 8, fixe 0 + 8
  "41": /^0(?:[1-58-9]\d|7[5-9])\d{7}$/,      // CH : 0 + 9 ; 075-079 = mobiles suisses, les autres 06 / 07 sont français

  else if (cc && LOCAL[cc] && LOCAL[cc].test(d)) return "+" + cc + d.slice(1);
  if (cc === "33" && /^33[1-9]\d{8}$/.test(d)) return "+" + d;
  if (cc === "41" && /^06[12]\d{7}$/.test(d)) return s;   // 061 / 062 : Bâle-Argovie ou mobile français, on ne devine pas
  if (/^0[67]\d{8}$/.test(d)) return "+33" + d.slice(1);   // mobile français sur une fiche d'un autre pays

  const list = S.contacts.get(d.company_id) || [], old = ce.id ? list.find((p) => p.id === ce.id) : null;

  S.busy = true; render();
  let p = null, linked = 0, failed = 0;

    S.contacts.set(d.company_id, ce.id ? list.map((x) => (x.id === p.id ? p : x)) : [...list, p]);
    S.ce = null;
    // Ligne de chronologie écrite dans la langue de la personne qui fait la modification.
    const who = fullName(p) || p.phone || p.email || T("sans nom", "no name"), empty = T("vide", "empty");
    const body = old
      ? T("Contact modifié : ", "Contact edited: ") + who + "\n" + changed.map(([k, l]) => `${l}${T(" : ", ": ")}${old[k] || empty} → ${p[k] || empty}`).join("\n")

    const act = await sb.from("crm_activities").insert({ deal_id: d.id, company_id: d.company_id, contact_id: p.id, kind: "note", body, author_id: S.me.user_id, author_label: S.me.display_name });
    // Appels Onoff déjà en attente (« à rattacher ») dont le numéro correspond : rattachés tout de suite à cette fiche.

      + (linked ? T(` ${linked} appel${sEn(linked)} Onoff rattaché${sEn(linked)} à la fiche.`, ` ${linked} Onoff call${sEn(linked)} linked to the lead.`) : "")
      + (failed ? T(` ${failed} appel${sEn(failed)} Onoff non rattaché${sEn(failed)} : à faire dans « Ma journée ».`, ` ${failed} Onoff call${sEn(failed)} not linked: do it in "My day".`) : ""));

/* ---------- recherche globale (30/10) ----------
   Dans l'en-tête, sur tous les onglets, toutes étapes confondues (Perdu, Écarté et Gagné compris).
   En local : société, site, téléphone, contacts (nom, e-mail, téléphone). En base : texte des notes, appels et mails (crm_activities). */
const G = { q: "", hits: [], notes: [], noteQ: "", items: [], idx: -1, timer: null, seq: 0 };
const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

function gsMatch(d, q, qd) {
  const c = d.company, people = S.contacts.get(d.company_id) || [];
  if (norm(c.name).includes(q)) return { rank: norm(c.name).startsWith(q) ? 0 : 1, why: "" };
  for (const p of people) {
    if (norm(fullName(p)).includes(q)) return { rank: 2, why: fullName(p) + (p.job_title ? " · " + p.job_title : "") };
    if (norm(p.email).includes(q)) return { rank: 2, why: p.email };
  }
  if (norm(c.website).includes(q)) return { rank: 3, why: c.website };
  if (qd.length >= 4) {
    if (digits(c.phone).includes(qd)) return { rank: 3, why: c.phone };
    const p = people.find((x) => digits(x.phone).includes(qd));
    if (p) return { rank: 3, why: `${p.phone} · ${fullName(p) || "contact"}` };
  }
  return null;
}
function mark(text, q) {
  const i = norm(text).indexOf(norm(q.trim()));

  const n = q.trim().length;
  return [text.slice(0, i), h("mark", { text: text.slice(i, i + n) }), text.slice(i + n)];
}
function snippet(text, q) {
  const t = String(text || "").replace(/\s+/g, " "), i = norm(t).indexOf(norm(q));
  if (i < 0) return t.slice(0, 120);
  const a = Math.max(0, i - 40);
  return (a ? "…" : "") + t.slice(a, a + 140);
}

    .sort((a, b) => a[1].rank - b[1].rank || a[0].company.name.localeCompare(b[0].company.name));

  }

  inp.addEventListener("focus", () => { if (G.q.trim()) gsRender(); });
  inp.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      if (!G.items.length) return; ev.preventDefault();
      G.idx = ev.key === "ArrowDown" ? (G.idx + 1) % G.items.length : (G.idx <= 0 ? G.items.length - 1 : G.idx - 1);
      gsRender(); $("gsItem" + G.idx)?.scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter") {
      ev.preventDefault(); const id = G.items[Math.max(0, G.idx)]; if (id) gsOpen(id);
    } else if (ev.key === "Escape") {
      ev.stopPropagation();   // ne ferme pas la fiche ouverte derrière
      if (!$("gsRes").hidden) gsClose(); else { inp.value = ""; G.q = ""; gsRun(); inp.blur(); }
    }
  });
  document.addEventListener("click", (ev) => { if (!$("gs").contains(ev.target)) gsClose(); });
  document.addEventListener("keydown", (ev) => {   // « / » ou Ctrl+K (Cmd+K sur Mac) : aller à la recherche depuis n'importe où
    const typing = ev.target.closest?.("input,textarea,select,[contenteditable]");
    if ((ev.key === "/" && !typing && !ev.ctrlKey && !ev.metaKey) || ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k")) {
      if ($("app").hidden) return; ev.preventDefault(); inp.focus(); inp.select();
    }
  });
}

/* ---------- langue : textes fixes de la page et bouton FR / EN ---------- */
function applyStatic() {
  document.documentElement.lang = LANG;
  $("loginTitle").textContent = T("Connexion", "Sign in");
  $("lEmail").textContent = T("E-mail", "Email");
  $("lPass").textContent = T("Mot de passe", "Password");
  $("loginBtn").textContent = T("Se connecter", "Sign in");
  const gi = $("gsInput");
  gi.placeholder = T("Rechercher : société, contact, téléphone, site, note…", "Search: company, contact, phone, website, note…");
  gi.setAttribute("aria-label", T("Rechercher dans tout le CRM", "Search the whole CRM"));
  $("logout").textContent = T("Se déconnecter", "Sign out");
  $("notYou").textContent = T("Ce n'est pas vous ?", "Not you?");
  $("drawer").setAttribute("aria-label", T("Fiche", "Lead"));
  document.querySelectorAll("#langSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
}
function setLang(l) { LANG = l === "en" ? "en" : "fr"; lsSet("crm_lang:last", LANG); buildLabels(); applyStatic(); }
function renderWho() {
  const who = $("whoami"); who.textContent = "";
  who.appendChild(h("b", { text: S.me.display_name })); who.appendChild(document.createTextNode(S.me.role === "viewer" ? T(" · lecture seule", " · read-only") : S.me.role === "admin" ? " · admin" : ""));
}

/* ---------- session ---------- */
async function boot(user) {
  const { data, error } = await sb.from("crm_members").select("*");
  const me = !error && data ? data.find((m) => m.user_id === user.id && m.active) : null;
  if (!me) {
    await sb.auth.signOut({ scope: "local" }); $("app").hidden = true; $("login").hidden = false;
    $("loginMsg").textContent = T("Ce compte n'a pas accès au CRM. Demande l'accès à Cyriaque.", "This account has no access to the CRM. Ask Cyriaque for access."); return;
  }
  // Langue du compte : ?lang= (gardé pour ce compte) → choix déjà fait avec le bouton → anglais d'office pour EN_MEMBERS.
  S.uid = user.id; S.crmOnly = CRM_ONLY.includes(S.uid);
  if (QS_LANG) lsSet("crm_lang:" + S.uid, QS_LANG);
  setLang(QS_LANG || savedLang(S.uid) || defaultLang(S.uid));
  document.body.classList.toggle("crm-only", S.crmOnly);
  S.me = me; S.tab = me.role === "viewer" ? "fiches" : "jour"; S.sel = null; S.open = null; S.actsFor = null;
  $("login").hidden = true; $("app").hidden = false;
  const shared = !!OPEN_ACCESS && user.email === OPEN_ACCESS.email;
  $("logout").hidden = shared; $("notYou").hidden = !shared;   // session nominative : Déconnexion ; compte partagé : pas de bouton, mais un lien vers la connexion nominative
  renderWho();
  $("view").textContent = ""; $("view").appendChild(h("div", { class: "empty", text: T("Chargement des fiches…", "Loading leads…") }));
  try { await load(); render(); } catch (e) { $("view").textContent = ""; $("view").appendChild(h("div", { class: "empty", text: T("Chargement impossible : ", "Could not load: ") + (e.message || e) })); }
}
async function init() {
  buildLabels(); applyStatic();
  sb = createClient(SUPABASE_URL, SUPABASE_ANON);
  gsInit();
  $("langSeg").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-lang]");
    if (!b || b.dataset.lang === LANG) return;
    if (S.uid) lsSet("crm_lang:" + S.uid, b.dataset.lang);   // choix gardé pour ce compte, dans ce navigateur
    setLang(b.dataset.lang); gsClose();
    if (S.me) { renderWho(); render(); }
  });
  $("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault(); $("loginMsg").textContent = ""; $("loginBtn").disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    $("loginBtn").disabled = false;
    if (error) { $("loginMsg").textContent = T("E-mail ou mot de passe incorrect.", "Wrong email or password."); return; }
    $("password").value = ""; boot(data.user);
  });
  $("logout").addEventListener("click", async () => { await sb.auth.signOut({ scope: "local" }); S.me = null; S.open = null; S.uid = ""; S.crmOnly = false; document.body.classList.remove("crm-only"); $("gsInput").value = ""; G.q = ""; gsRun(); $("app").hidden = true; $("overlay").hidden = true; $("login").hidden = false; });
  $("overlay").addEventListener("click", (ev) => { if (ev.target === $("overlay")) closeFiche(); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && (S.open || S.newOpen)) closeFiche(); });
  const qs = new URLSearchParams(location.search);
  const nominative = qs.has("login");   // ?login=1 : connexion nominative (même motif que team/dashboard.html), pas d'auto-login
  const { data: sessData } = await sb.auth.getSession();
  let session = sessData?.session ?? null;
  /* ?p=<jeton> : porte nominative (lien magique personnel, décision du 14/10). Même mécanique que team/dashboard.html. */
  const PORTE = qs.get("p");
  if (PORTE) {
    try {
      const [pEmail, pKey] = atob(PORTE.replace(/-/g, "+").replace(/_/g, "/")).split("\n");
      if (pEmail && pKey) {
        if (session && String(session.user.email).toLowerCase() !== pEmail.toLowerCase()) { await sb.auth.signOut({ scope: "local" }); session = null; }
        if (!session) { const r = await sb.auth.signInWithPassword({ email: pEmail, password: pKey }); if (!r.error) session = r.data.session; }
      }
    } catch (e) { /* jeton illisible : on laisse la suite décider */ }
  }
  if (session && OPEN_ACCESS && nominative && session.user.email === OPEN_ACCESS.email) { await sb.auth.signOut({ scope: "local" }); session = null; }   // on quitte la session partagée « Équipe » ; scope local : ne révoque PAS les jetons des autres personnes connectées au même compte partagé
  if (session) boot(session.user);
  else if (OPEN_ACCESS && !nominative) { const r = await sb.auth.signInWithPassword(OPEN_ACCESS); if (r.error) $("login").hidden = false; else boot(r.data.user); }
  else $("login").hidden = false;
}
init();
</script>
