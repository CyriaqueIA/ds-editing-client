<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>DS Editing — Espaces</title>
<link rel="icon" type="image/png" href="../assets/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet"/>
<style>
/* Accueil des espaces DS Editing (07/10/2026).
   La page ne contient AUCUNE liste : elle lit window.DS_ESPACES posé par ../nav.js.
   Ajouter un espace = une ligne dans nav.js, il apparaît ici et dans le menu, sans toucher à cette page. */
:root{
  --bg:#FCFCFB; --surface:#F2F4F5; --line:rgba(12,22,34,.12); --line-strong:rgba(12,22,34,.28);
  --fg:#0B0D10; --muted:#5A6570; --accent:#24466F; --accent-soft:rgba(36,70,111,.10);
  --font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#050607; --surface:#0F1114; --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.24);
    --fg:#F5F5F1; --muted:#9AA3AD; --accent:#B9C9DA; --accent-soft:rgba(185,201,218,.12); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shell{max-width:1040px;margin:0 auto;padding:40px 16px 72px;display:flex;flex-direction:column;gap:28px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.03em;font-size:20px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.brand em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-.035em}
.sub{color:var(--muted);font-size:15px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:5px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.card b{font-weight:600;font-size:16px;letter-spacing:-.015em;display:flex;align-items:center;gap:7px}
.card b::after{content:'→';color:var(--muted);font-weight:400;margin-left:auto}
.card span{color:var(--muted);font-size:13.5px}
.card .url{font-size:12px;color:var(--muted);opacity:.65;overflow-wrap:anywhere}
.card.here{border-color:var(--accent);background:var(--accent-soft)}
.card.here b::after{content:'tu es ici';font-size:11.5px}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:12px;max-width:70ch}
</style>
</head>
<body>
<div class="shell">
  <span class="brand"><i></i>DS<em>Editing</em></span>
  <div style="display:flex;flex-direction:column;gap:8px">
    <h1>Tes espaces</h1>
    <p class="sub">Tout DS Editing part d'ici. Mets cette page en favori : tu n'as plus besoin de retenir une seule adresse.</p>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">Le menu « Espaces » en haut à droite de chaque page mène aussi ici. Un espace manque&nbsp;? Il s'ajoute en une ligne dans <code>nav.js</code> et il apparaît partout.</p>
</div>
<script src="../nav.js" defer></script>
<script defer>
addEventListener("load", function () {
  var grid = document.getElementById("grid");
  var liste = window.DS_ESPACES || [];
  var base = window.DS_BASE || "";
  if (!liste.length) {
    grid.innerHTML = '<p class="sub">La liste des espaces n\'a pas pu être chargée (nav.js). Recharge la page.</p>';
    return;
  }
  var ici = location.pathname.replace(/index\.html$/, "").replace(/\/+$/, "/") || "/";
  liste.forEach(function (e) {
    var href = base + e[1];
    var cible = href.replace(/index\.html$/, "").replace(/\/+$/, "/") || "/";
    if (cible === ici) return; // inutile de se proposer soi-même
    var a = document.createElement("a");
    a.className = "card";
    a.href = href;
    var b = document.createElement("b"); b.textContent = e[0];
    var s = document.createElement("span"); s.textContent = e[2] || "";
    var u = document.createElement("span"); u.className = "url"; u.textContent = location.host + href;
    a.appendChild(b); a.appendChild(s); a.appendChild(u);
    grid.appendChild(a);
  });
});
</script>
</body>
</html>
