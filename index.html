<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Espace client · DS Editing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F4F5F8; --panel: #FFFFFF; --fg: #171A21; --muted: #667085; --line: #E2E5EB; --soft: #EEF1F6;
    --brand: #2F5D8A; --brand-ink: #FFFFFF; --brand-soft: #E4EDF6;
    --ok: #1E7F4F; --ok-soft: #E3F3EA; --warn: #A8690F; --warn-soft: #FBEFD9; --crit: #B3261E; --crit-soft: #FBE4E2;
    --shadow: 0 1px 2px rgba(23,26,33,.05), 0 8px 24px rgba(23,26,33,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1217; --panel: #171B22; --fg: #E8EBF0; --muted: #98A2B3; --line: #262C36; --soft: #1F242D;
      --brand: #7FB0E0; --brand-ink: #0B1520; --brand-soft: #1B2A3A;
      --ok: #5CC48A; --ok-soft: #14301F; --warn: #E2B25A; --warn-soft: #3A2A0E; --crit: #F08A82; --crit-soft: #3B1714;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: var(--brand); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: "IBM Plex Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  h1 { font-size: 1.45rem; margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
  h2 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }

  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
  .studio { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; }
  .studio .logo { width: 36px; height: 36px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; letter-spacing: .04em; font-size: .85rem; overflow: hidden; }
  .studio .logo img { width: 100%; height: 100%; object-fit: cover; }
  .studio b { display: block; line-height: 1.15; }
  .studio small { color: var(--muted); font-size: .78rem; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-weight: 500; }
  .nav a:hover { background: var(--soft); }
  .nav a[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
  .nav a .badge { margin-left: auto; background: var(--crit); color: #fff; font-size: .7rem; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
  .nav svg { width: 18px; height: 18px; flex: none; }
  .side .foot { margin-top: auto; font-size: .78rem; color: var(--muted); padding: 8px 10px; }
  .side .foot a { color: var(--muted); }
  .main { padding: 24px 28px 96px; max-width: 1080px; width: 100%; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .topbar .actions { display: flex; gap: 8px; align-items: center; }

  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .btn.sm { padding: 5px 10px; font-size: .86rem; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  @property --cta-angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .cta { position: relative; isolation: isolate; border: 0; border-radius: 12px; padding: 12px 20px 12px 16px; background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 55%, #7FE3FF)); color: var(--brand-ink); font-weight: 700; letter-spacing: .01em; overflow: hidden; box-shadow: 0 6px 20px color-mix(in srgb, var(--brand) 35%, transparent), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease; }
  .btn.cta, .btn.cta:hover { background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 55%, #7FE3FF)); border: 0; }
  .cta::before { content: ""; position: absolute; inset: -2px; z-index: -2; border-radius: 14px; background: conic-gradient(from var(--cta-angle), transparent 0 60%, rgba(255,255,255,.85) 75%, transparent 90%); animation: cta-spin 3.2s linear infinite; }
  .cta::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 12px; background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 55%, #7FE3FF)); }
  .cta .shine { position: absolute; inset: 0; z-index: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-120%); }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 30px color-mix(in srgb, var(--brand) 45%, transparent), inset 0 1px 0 rgba(255,255,255,.3); }
  .cta:hover .shine { animation: cta-shine .9s ease forwards; }
  .cta:active { transform: translateY(0) scale(.98); }
  .cta svg { position: relative; z-index: 1; width: 22px; height: 22px; animation: cta-pulse 2.4s ease-in-out infinite; }
  .cta span { position: relative; z-index: 1; }
  @keyframes cta-spin { to { --cta-angle: 360deg; } }
  @keyframes cta-shine { to { transform: translateX(120%); } }
  @keyframes cta-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .cta::before, .cta svg, .cta .shine { animation: none !important; } }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: .86rem; font-weight: 600; }
  .field label i { color: var(--crit); font-style: normal; }
  .field .hint { font-size: .8rem; color: var(--muted); }
  input[type=text], input[type=url], input[type=date], input[type=number], input[type=password], input[type=email], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 11px; }
  textarea { min-height: 96px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .panel .head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .panel .body { padding: 18px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .stat b { display: block; font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; }
  .stat span { font-size: .82rem; color: var(--muted); }
  .stat.alert { border-color: var(--crit); }
  .stat.alert b { color: var(--crit); }
  .vlist { display: flex; flex-direction: column; }
  .vrow { display: grid; grid-template-columns: 1.6fr 1fr 1.4fr auto; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
  .vrow:first-child { border-top: none; }
  .vrow:hover { background: var(--soft); }
  .vrow .t b { display: block; font-weight: 600; }
  .vrow .t small { color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.s0 { background: var(--soft); color: var(--muted); }
  .chip.s1 { background: var(--brand-soft); color: var(--brand); }
  .chip.s2 { background: var(--warn-soft); color: var(--warn); }
  .chip.s3 { background: var(--ok-soft); color: var(--ok); }
  .chip.s4 { background: var(--crit-soft); color: var(--crit); }
  .chip.s5 { background: var(--ok); color: #fff; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .steps i { display: block; height: 6px; border-radius: 3px; background: var(--line); }
  .steps i.on { background: var(--brand); }
  .steps i.done { background: var(--ok); }
  .stepl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: .72rem; color: var(--muted); margin-top: 4px; }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 14px; font-size: .92rem; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-word; }
  .brief h4 { margin: 12px 0 2px; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .brief p { margin: 0; white-space: pre-line; }
  .deliver { background: var(--ok-soft); border: 1px solid var(--ok); border-radius: 12px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .deliver b { display: block; }
  .comment { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .92rem; }
  .comment:first-child { border-top: none; }
  .comment .tc { color: var(--brand); font-weight: 500; }
  .comment small { color: var(--muted); display: block; }
  .thread { display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 12px; background: var(--soft); white-space: pre-line; }
  .msg.me { align-self: flex-end; background: var(--brand-soft); }
  .msg small { display: block; color: var(--muted); font-size: .76rem; margin-bottom: 2px; white-space: normal; }
  .via { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: .68rem; color: var(--muted); vertical-align: middle; }
  .compose { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
  table.inv { width: 100%; border-collapse: collapse; }
  table.inv th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 18px; border-bottom: 1px solid var(--line); }
  table.inv td { padding: 12px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.inv tr:last-child td { border-bottom: none; }
  .num { text-align: right; white-space: nowrap; }
  .accesslink { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .accesslink code { display: block; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-family: "IBM Plex Mono", Menlo, monospace; font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .gate .card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
  .gate .card .studio { padding: 0 0 6px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; box-shadow: var(--shadow); max-width: 92vw; z-index: 20; }
  .toast.err { background: var(--crit); color: #fff; }
  .tabbar { display: none; }
  .loading { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    .main { padding: 16px 14px 92px; }
    .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); z-index: 10; }
    .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 10px; font-size: .68rem; color: var(--muted); text-decoration: none; font-weight: 600; }
    .tabbar a[aria-current="page"] { color: var(--brand); }
    .tabbar svg { width: 20px; height: 20px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .vrow { grid-template-columns: 1fr; gap: 8px; }
    .grid2, .grid3 { grid-template-columns: 1fr; }
    .kv { grid-template-columns: 1fr; }
    .msg { max-width: 92%; }
    table.inv th:nth-child(3), table.inv td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>
<div id="root"><div class="loading">Ouverture de votre espace…</div></div>
<div id="toast-root"></div>

<script>
/* ============ Configuration ============ */
var SUPABASE_URL = "https://xkanmjlpysxpohsuqvwg.supabase.co";
var SUPABASE_KEY = "sb_publishable_lIZtV_WtN5NcGSb0dnfaiQ_AgKYBIVa"; // clé publique (sb_publishable_…), sans danger dans un navigateur
var STAGES = ["Reçu", "En montage", "Contrôle qualité", "Livré"];
var STATUS = { recu: ["Reçu", "s0", 0], attribue: ["Reçu", "s0", 0], montage: ["En montage", "s1", 1], bloque: ["En attente d'éléments", "s2", 1],
  qc: ["Contrôle qualité", "s2", 2], livre: ["À approuver", "s4", 3], retours: ["Retours en cours", "s2", 1], approuve: ["Approuvée", "s5", 3], facture: ["Facturée", "s5", 3] };
var ERR = { LIEN_INVALIDE: "Ce lien d'accès n'est pas valide. Écrivez à contact@ds-editing.com.", BRIEF_INCOMPLET: "Les cinq points du brief sont obligatoires.",
  LIENS_REQUIS: "Ajoutez au moins un lien vers vos rushes.", CLIENT_FINAL_REQUIS: "Choisissez un client final.", NON_APPROUVABLE: "Cette vidéo n'est pas en attente d'approbation.",
  PAS_EN_ATTENTE_DE_RETOURS: "Cette vidéo n'est pas en attente de retours.", NOTE_REQUISE: "Décrivez les modifications souhaitées.", MESSAGE_VIDE: "Le message est vide.",
  PIN_4_A_6_CHIFFRES: "Le code doit faire 4 à 6 chiffres.", NOM_REQUIS: "Le nom est obligatoire." };
var ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  inv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="11" height="11"><path d="M4 20l1.3-3.8A8 8 0 1 1 8.2 19z"/></svg>'
};

/* ============ État, accès, API ============ */
var token = null, pin = null, data = null, busy = false;
function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function tokenFromUrl() {
  var m = (location.hash + location.search).match(/(?:#\/e\/|[?&]e=)([a-f0-9]{16,64})/i);
  return m ? m[1] : null;
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function fr(d) { if (!d) return ""; var s = String(d).slice(0, 10).split("-"); return s.length === 3 ? s[2] + "/" + s[1] + "/" + s[0] : d; }
function frdt(d) { if (!d) return ""; var x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) + " " + x.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
function money(n, cur) { return (Number(n) || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + (cur === "USD" ? "$" : "€"); }
function toast(t, err) {
  var r = document.getElementById("toast-root"); r.innerHTML = '<div class="toast' + (err ? " err" : "") + '" role="status">' + esc(t) + "</div>";
  clearTimeout(toast._t); toast._t = setTimeout(function () { r.innerHTML = ""; }, err ? 5000 : 3200);
}
function friendly(e) { var m = String(e && e.message || e || ""); for (var k in ERR) if (m.indexOf(k) >= 0) return ERR[k]; return "Une erreur est survenue. Réessayez, ou écrivez à contact@ds-editing.com."; }
function rpc(fn, params) {
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }, body: JSON.stringify(params || {}) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || j.hint || r.status); return j; }); });
}
function reload() {
  return rpc("space_open", { p_token: token, p_pin: pin }).then(function (d) {
    if (d.pin_required) { data = null; renderGate("pin", d.studio.name); return null; }
    data = d; applyBrand(); render(); return d;
  }).catch(function (e) { data = null; renderGate(String(e.message).indexOf("LIEN_INVALIDE") >= 0 ? "invalid" : "error"); });
}
function applyBrand() {
  var c = data && data.studio.brand_color; var root = document.documentElement;
  if (c && /^#[0-9a-f]{6}$/i.test(c)) { root.style.setProperty("--brand", c); root.style.setProperty("--brand-soft", "color-mix(in srgb, " + c + " 14%, var(--panel))"); }
}
function act(fn, params, okMsg) {
  if (busy) return Promise.resolve(); busy = true;
  return rpc(fn, params).then(function (r) { busy = false; if (okMsg) toast(okMsg); return reload().then(function () { return r; }); })
    .catch(function (e) { busy = false; toast(friendly(e), true); throw e; });
}

/* ============ Portes d'entrée ============ */
function renderGate(kind, name) {
  var h;
  if (kind === "pin") {
    h = '<form class="card" onsubmit="return enterPin(event)"><div class="studio"><div class="logo">' + initials(name) + "</div><div><b>" + esc(name) + '</b><small>Espace client</small></div></div>' +
      '<p style="margin:0">Ce studio a activé un code d\'accès.</p><div class="field"><label>Code</label><input type="text" name="pin" inputmode="numeric" autocomplete="one-time-code" autofocus required></div>' +
      '<button class="btn primary" type="submit">Ouvrir mon espace</button></form>';
  } else if (kind === "invalid") {
