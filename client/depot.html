<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#050607"/>
  <meta name="robots" content="noindex"/>
  <title>DS Editing — Nouveau projet</title>
  <link rel="icon" type="image/png" href="../assets/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#050607; --surface:#0F1114; --surface-2:#161A1F; --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.22);
      --cream:#F5F5F1; --taupe:#9AA3AD; --amber:#DCE3EA; --amber-soft:rgba(220,227,234,.12); --ok:#46D369; --err:#F08A82;
      --accent-blue:#B9C9DA;
      --chrome:linear-gradient(180deg,#FFFFFF 0%,#E3E7EC 38%,#9BA4AE 72%,#D6DBE0 100%);
      --chrome2:linear-gradient(95deg,#B9C9DA 0%,#7FA3CF 45%,#E6ECF2 100%);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{color-scheme:dark}
    html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(1200px 700px at 85% -5%, rgba(125,155,195,.16), transparent 60%), radial-gradient(900px 600px at -10% 40%, rgba(160,170,185,.08), transparent 60%), #050607;background-attachment:fixed}
    a{color:inherit}
    .mono{font-family:'Geist',system-ui,sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;font-variant-numeric:tabular-nums;color:var(--taupe)}
    .display{font-family:'Geist',system-ui,sans-serif;font-weight:600;letter-spacing:-.035em;text-transform:none;line-height:.98;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
    .display em,.display .ac{font-style:normal;background:var(--chrome2);-webkit-background-clip:text;background-clip:text;color:transparent}

    header{position:sticky;top:0;z-index:20;background:rgba(8,9,11,.62);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid var(--line)}
    .hd{max-width:960px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
    .hd img{width:34px;height:34px;border-radius:8px;object-fit:cover}
    .lv-rec{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:22px;letter-spacing:-.04em;line-height:1;color:var(--cream);white-space:nowrap}
    .lv-rec i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);animation:blink 1.6s infinite;margin-right:2px}
    .lv-rec em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--taupe);margin-left:2px}
    @keyframes blink{50%{opacity:.2}}
    .hd .brand{display:flex;flex-direction:column;gap:2px}
    .hd .brand b{display:none} /* le nom est déjà porté par le logo « ● Rec » */
    .hd .client{margin-left:auto;display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid rgba(255,255,255,.16);border-radius:999px;font-size:13px;background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
    .hd .client i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
    .lang{margin-left:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:var(--taupe);border-radius:999px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:border-color .2s,color .2s}

    main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:28px 16px 90px}
    .intro h1{margin:18px 0 8px;font-size:clamp(34px,6vw,58px)}
    .intro p{margin:0;color:var(--taupe);max-width:60ch;font-size:15px;line-height:1.55}

    .steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:26px 0 22px}
    .step{padding:10px 10px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);position:relative;overflow:hidden;cursor:pointer;transition:border-color .2s}
    .step .n{font-family:'Geist',system-ui,sans-serif;font-weight:600;font-size:10px;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--taupe)}
    .step .t{font-size:12px;margin-top:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .step::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--amber);transition:width .35s}
    .step.active{border-color:var(--line-strong)}
    .step.active::after,.step.done::after{width:100%}
    .step.done .n{color:var(--ok)}
    @media (max-width:640px){.steps{grid-template-columns:repeat(3,1fr)}}

    .card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09);border-radius:var(--radius);padding:22px;margin-bottom:16px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
    .card h2{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.02em}
    .card .hint{margin:0 0 18px;color:var(--taupe);font-size:14px;line-height:1.5}
    .panel{display:none}.panel.active{display:block;animation:fade .25s ease}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .block{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
    .block:first-of-type{margin-top:0;padding-top:0;border-top:0}
    .block h3{margin:0 0 4px;font-size:16px;font-weight:600}
    .block .sub{margin:0 0 12px;color:var(--taupe);font-size:13px;line-height:1.5}

    label.f{display:block;margin:14px 0 6px;font-size:14px;font-weight:500}
    label.f small{color:var(--taupe);font-weight:400;margin-left:6px}
    .in,textarea.in{width:100%;background:rgba(255,255,255,.04);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
    .in:focus{border-color:rgba(220,227,234,.6);box-shadow:0 0 0 3px rgba(220,227,234,.14)}
    .in::placeholder{color:rgba(154,163,173,.6)}
    textarea.in{min-height:150px;resize:vertical;line-height:1.5}
    .in.bad{border-color:var(--err)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:640px){.row{grid-template-columns:1fr}}

    /* cartes de choix */
    .choices{display:grid;gap:10px;margin-top:8px}
    .choices.two{grid-template-columns:1fr 1fr}
    .choices.three{grid-template-columns:repeat(3,1fr)}
    @media (max-width:720px){.choices.two,.choices.three{grid-template-columns:1fr}}
    .c{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
    .c.on{border-color:rgba(220,230,240,.5);background:var(--amber-soft)}
    .c .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .c .name{font-weight:600;font-size:16px}
    .c .price{font-family:'Geist',system-ui,sans-serif;font-weight:600;font-size:11px;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--taupe);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
    .c.on .price{color:#0A0B0D;background:rgba(255,255,255,.85);border-color:transparent}
    .c .desc{font-size:13px;color:var(--taupe);line-height:1.45;flex:1}
    .c .inc{display:block;margin-top:6px;font-weight:600}
    .promo{display:flex;flex-direction:column;gap:6px;margin-top:2px}
    .promo .row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
    .promo .tag{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;color:#0A0B0D;background:rgba(255,255,255,.85)}
    .promo .lvn{color:var(--taupe);min-width:62px}
    .promo s{color:var(--taupe);text-decoration:line-through}
    .promo b{color:var(--cream);font-weight:600}
    .promo .pct{color:var(--taupe)}
    .lv{display:flex;gap:6px;flex-wrap:wrap}
    .lv button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:transparent;color:var(--taupe);cursor:pointer}
    .lv button.on{color:#0A0B0D;background:rgba(255,255,255,.85);border-color:transparent}
    .c .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
    .preview{flex:none;max-width:100%;white-space:nowrap;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:999px;color:#fff;font:inherit;font-size:13px;font-weight:600;letter-spacing:-.01em;cursor:pointer;padding:5px 12px 5px 5px;display:inline-flex;align-items:center;gap:6px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:border-color .2s,color .2s}
    .preview[disabled]{color:var(--taupe);cursor:default;opacity:.45}
    .preview i{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-style:normal}
    .qty{display:flex;align-items:center;flex-wrap:wrap;gap:6px;row-gap:8px}
    .qty button:not(.preview){width:34px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;line-height:1;transition:border-color .2s,background .2s}
    .qty input{width:52px;height:34px;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;color:var(--cream);font:inherit;font-size:15px;font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s,box-shadow .15s}
    .qty input:focus{border-color:rgba(220,227,234,.6);box-shadow:0 0 0 3px rgba(220,227,234,.14)}
    .qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
    .qty .lab{font-size:13px;color:var(--taupe);margin-right:6px}
    .qty .price{font-weight:600;font-variant-numeric:tabular-nums}
    .thumbs{display:flex;gap:8px;margin:8px 0 4px}
    .thumbs a,.thumbs span{width:96px;aspect-ratio:16/9;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,var(--surface),var(--surface-2));display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--taupe);text-decoration:none;overflow:hidden;transition:border-color .2s}
    .thumbs a img{width:100%;height:100%;object-fit:cover}
    .note{font-size:12px;color:var(--taupe);margin-top:8px;line-height:1.5}

    .links{display:flex;flex-direction:column;gap:8px}
    .links .l{display:flex;gap:8px}
    .links .l .in{flex:1}
    .links .l button{width:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--taupe);cursor:pointer;font-size:18px;transition:border-color .2s,color .2s}
    .add{margin-top:8px;background:rgba(255,255,255,.04);border:1px dashed var(--line-strong);color:var(--taupe);border-radius:999px;padding:11px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;width:100%;transition:border-color .2s,color .2s,background .2s}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
    .chip{border:1px solid var(--line-strong);background:rgba(255,255,255,.04);color:var(--cream);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;transition:border-color .2s,background .2s}
    .swatches{display:flex;gap:6px;margin-top:8px;min-height:18px}
    .swatches i{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-strong)}
    .brandkit{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
    @media (max-width:640px){.brandkit{grid-template-columns:1fr}}
    .kh{display:flex;align-items:center;gap:8px;font-family:'Geist',system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cream)}
    .kh svg{color:var(--accent-blue);flex:none}
    .ks{margin:6px 0 10px;font-size:12px;color:var(--taupe)}
    .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:82px;border:1px dashed var(--line-strong);border-radius:14px;background:rgba(255,255,255,.03);cursor:pointer;color:var(--taupe);font-size:13px;text-align:center;padding:12px;transition:border-color .2s,background .2s,color .2s}
    .drop .up{color:var(--accent-blue)}
    .drop.over{border-color:rgba(220,230,240,.5);background:var(--amber-soft);color:var(--cream)}
    .drop.has{border-style:solid;border-color:rgba(220,227,234,.5);background:var(--surface);color:var(--cream)}
    .drop img{max-height:56px;max-width:80%;object-fit:contain;border-radius:6px}
    .cta-block{margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
    .yn{display:flex;gap:10px}
    .yn button{min-width:78px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;padding:11px 20px;cursor:pointer;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:border-color .2s,background .2s,color .2s}
    .yn button.on{background:linear-gradient(180deg,#FFFFFF,#C9D0D7);border-color:transparent;color:#0A0B0D;box-shadow:inset 0 1px 0 #fff,0 8px 30px rgba(180,200,225,.18)}
    .cta-ex{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:13px;color:var(--taupe)}
    .cta-ex #ctaChips{display:flex;gap:8px;flex-wrap:wrap}
    .cx{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--cream);font:inherit;font-size:13px;padding:8px 12px;cursor:default;transition:border-color .2s}
    .cx.live{cursor:pointer}
    .cx i{width:14px;height:14px;border-radius:50%;border:1px solid var(--accent-blue);color:var(--accent-blue);font-size:9px;font-style:normal;display:inline-flex;align-items:center;justify-content:center}
    .cx .pop{display:none;position:absolute;bottom:calc(100% + 10px);left:0;z-index:30;width:280px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:14px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
    .cx:focus .pop{display:block}
    .cx .pop img,.cx .pop video{display:block;width:100%;border-radius:8px;background:#000}
    .cx .pop span{display:block;padding:18px 8px;text-align:center;color:var(--taupe);font-size:12px}
    .fontpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .fontpick button{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--taupe);font:inherit;font-size:14px;text-align:left;padding:16px;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
    .fontpick button.on{border-color:rgba(220,230,240,.5);background:var(--amber-soft);color:var(--cream)}
    .check{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--taupe);cursor:pointer}
    .check input{width:18px;height:18px;accent-color:var(--amber)}

    .nav{position:sticky;bottom:0;background:rgba(8,9,11,.62);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--line);margin:0 -16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .btn{border:1px solid transparent;border-radius:999px;padding:13px 24px;line-height:1.2;font:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:transform .12s,opacity .15s,background .2s,border-color .2s;white-space:nowrap;text-decoration:none}
    .btn:active{transform:scale(.98)}
    .btn.primary{background:linear-gradient(180deg,#FFFFFF,#C9D0D7);color:#0A0B0D;box-shadow:inset 0 1px 0 #fff,0 8px 30px rgba(180,200,225,.18)}
    .btn.ghost{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
    .btn[disabled]{opacity:.45;cursor:not-allowed}
    .summary{font-size:12px;color:var(--taupe);text-align:center;line-height:1.4;flex:1;min-width:0;padding:6px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);font-variant-numeric:tabular-nums}
    .summary b{color:var(--cream);font-weight:500}
    .nav{flex-wrap:wrap}
    .msg{flex-basis:100%;order:-1;font-size:14px;font-weight:600;color:var(--err);text-align:center}
    .msg:empty{display:none}

    .recap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width:640px){.recap{grid-template-columns:1fr}}
    .recap .k{font-size:11px;color:var(--taupe);text-transform:uppercase;letter-spacing:.06em;font-family:'Geist',system-ui,sans-serif;font-weight:600;margin-bottom:4px}
    .recap .v{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-variant-numeric:tabular-nums}
    .recap .full{grid-column:1/-1}

    .success{text-align:center;padding:40px 10px}
    .success .ok{width:64px;height:64px;border-radius:50%;background:rgba(70,211,105,.12);border:1px solid rgba(70,211,105,.5);display:inline-flex;align-items:center;justify-content:center;color:var(--ok);font-size:28px;margin-bottom:16px}
    .success h2{font-size:34px;margin:0 0 8px}
    .success p{color:var(--taupe);max-width:52ch;margin:0 auto 22px;line-height:1.55}
    .next{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left;margin-top:8px}
    @media (max-width:640px){.next{grid-template-columns:1fr}}
    .next div{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);font-size:14px;line-height:1.45}
    .next b{display:block;margin-bottom:4px}
    .track{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:360px;margin:0 auto 22px;padding:16px 18px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface)}
    .track b{font-size:34px;font-weight:600;letter-spacing:.14em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--cream);user-select:all}
    .track small{font-size:12px;color:var(--taupe);line-height:1.45}
    .success p.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:none;margin:22px auto 0}
    footer{padding:18px 16px;text-align:center}

    /* aperçu vidéo */
    .modal{position:fixed;inset:0;z-index:50;background:rgba(5,6,7,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:16px}
    .modal.open{display:flex}
    .modal .box{width:min(960px,100%);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),var(--surface);border:1px solid rgba(255,255,255,.09);border-radius:22px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.6)}
    .modal .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
    .modal .bar button{background:none;border:none;color:var(--taupe);font-size:20px;cursor:pointer;transition:color .15s}
    .modal iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
    .modal video{display:block;width:100%;aspect-ratio:16/9;background:#000;max-height:72vh}
    .plist{display:flex;gap:8px;padding:10px;overflow-x:auto;border-top:1px solid var(--line)}
    .plist:empty{display:none}
    .plist button{flex:none;width:150px;border:1px solid var(--line);border-radius:10px;background:#000;padding:0;cursor:pointer;overflow:hidden;color:var(--cream);text-align:left;transition:border-color .2s}
    .plist button img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.75}
    .plist button span{display:block;padding:6px 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .plist button.on{border-color:var(--amber)}.plist button.on img{opacity:1}
    .terms{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);font-size:13px;line-height:1.45;cursor:pointer}
    .terms input{margin-top:3px;accent-color:var(--amber);width:16px;height:16px;flex:none}
    .terms a{color:var(--accent-blue);text-decoration:underline;text-underline-offset:2px}

    /* « Autres prestations » : lignes construites depuis la grille du client (table offers × client_prices) */
    .more{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
    .more h3{margin:0 0 4px;font-size:16px;font-weight:600}
    .more .sub{margin:0 0 12px;color:var(--taupe);font-size:13px;line-height:1.5}
    .ohead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-family:'Geist',system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-blue)}
    .ohead.sec{margin-top:14px;color:var(--taupe)}
    .olist{display:flex;flex-direction:column;gap:8px}
    .o{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s}
    .o.on{border-color:rgba(220,230,240,.5);background:var(--amber-soft)}
    .o .oname{flex:1;min-width:150px;font-size:15px;font-weight:500}
    .o .oprice{font-family:'Geist',system-ui,sans-serif;font-weight:600;font-size:11px;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--taupe);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
    .o.on .oprice{color:#0A0B0D;background:rgba(255,255,255,.85);border-color:transparent}
    .o.pack{border-radius:18px;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),var(--surface);border-color:rgba(220,230,240,.35)}
    .o.pack .oname{font-size:18px;font-weight:600;letter-spacing:-.01em}
    .o.pack.on{background:var(--amber-soft)}

    /* contenu réel d'un pack : chaque ligne à son prix unitaire (offers.bundle_parts), jamais une moyenne */
    .parts{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
    .parts .row{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
    .parts .pq{color:var(--taupe);min-width:26px}
    .parts .pn{flex:1;min-width:90px;color:var(--cream)}
    .parts b{color:var(--cream);font-weight:600}
    .parts s{color:var(--taupe);text-decoration:line-through}
    .parts .pct,.parts .lvn{color:var(--taupe)}
    .parts .tag{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;color:#0A0B0D;background:rgba(255,255,255,.85)}
    .o .parts{flex-basis:100%;width:100%}

    /* avertissement d'accès : visible sur TOUTES les étapes, pas seulement la première */
    .warn{flex-basis:100%;order:-2;font-size:13px;line-height:1.45;color:var(--taupe);text-align:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04)}
    .warn:empty{display:none}
    .warn a{color:var(--accent-blue);text-decoration:underline;text-underline-offset:2px}

    /* page périmée : GitHub Pages sert le HTML avec « Cache-Control: max-age=600 » et ne laisse pas régler
       ses en-têtes. Un onglet laissé ouvert garde l'ANCIEN formulaire et enverrait un payload au vieux
       format. Tant que ce bandeau est là, le bouton d'envoi est mort (verrou JS : renderStale). */
    .stale{flex-basis:100%;order:-3;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 14px;padding:11px 14px;border:1px solid rgba(220,230,240,.5);border-radius:14px;background:var(--amber-soft);font-size:13px;line-height:1.45;color:var(--cream);text-align:center}
    .stale[hidden]{display:none}
    .stale>span{flex:1 1 210px;min-width:0}
    .stale .btn{flex:none;padding:10px 18px;font-size:14px}
    /* bouton d'envoi désactivé par le bandeau : il ne reste pas un bouton blanc à peine pâli, il est éteint */
    .btn.primary.off{background:rgba(255,255,255,.07);color:var(--taupe);border-color:rgba(255,255,255,.16);box-shadow:none;opacity:.8}

    /* Survol : seulement sur un vrai pointeur. Au doigt, le :hover restait collé après un tap et une
       carte paraissait encore sélectionnée alors qu'elle ne l'était pas. */
    @media (hover:hover){
      .lang:hover{color:var(--cream);border-color:rgba(220,230,240,.35)}
      .step:not(.active):hover{border-color:var(--line-strong)}
      .c:not(.on):hover{border-color:var(--line-strong)}
      .o:not(.on):hover{border-color:var(--line-strong)}
      .preview:not([disabled]):hover{color:#fff;border-color:rgba(220,230,240,.35)}
      .qty button:not(.preview):hover{border-color:rgba(220,230,240,.35);background:rgba(255,255,255,.1)}
      .thumbs a:hover{border-color:var(--amber)}
      .links .l button:hover{color:var(--err);border-color:var(--err)}
      .add:hover{color:var(--cream);border-color:rgba(220,230,240,.35);background:rgba(255,255,255,.06)}
      .chip:hover{border-color:rgba(220,230,240,.5);color:var(--cream);background:var(--amber-soft)}
      .drop:not(.has):hover{border-color:rgba(220,230,240,.5);background:var(--amber-soft);color:var(--cream)}
      .yn button:not(.on):hover{border-color:rgba(220,230,240,.35)}
      .cx.live:hover{border-color:rgba(220,230,240,.5)}
      .cx:hover .pop{display:block}
      .fontpick button:not(.on):hover{border-color:var(--line-strong);color:var(--cream)}
      .btn.primary:hover{background:linear-gradient(180deg,#fff,#E4E8EC)}
      .btn.ghost:hover{color:var(--cream);border-color:rgba(220,230,240,.35)}
      .modal .bar button:hover{color:var(--cream)}
    }

    /* téléphone : la barre du bas tenait sur 5 à 6 lignes avec un pack, la ligne Trailer était écrasée */
    @media (max-width:520px){
      .nav{gap:8px}
      .nav .btn{flex:1 1 0;padding:13px 14px;text-align:center}
      .summary{order:3;flex-basis:100%;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
      .qty .lab{flex-basis:100%;margin-right:0}
      .qty .preview{margin-left:0!important}
      .thumbs{flex-wrap:wrap}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<header>
  <div class="hd">
    <span class="lv-rec"><i></i>DS<em>Editing</em></span>
    <div class="brand"><b>DS Editing</b><span class="mono" data-i="tagline"></span></div>

<main>
  <section class="intro">

  </section>

  <div class="steps" id="steps"></div>

  <form id="form" novalidate>

      <p class="hint" data-i="s1.hint"></p>
      <label class="f" for="projet" data-i="f.projet"></label>
      <input class="in" id="projet" name="projet" data-ph="ph.projet" autocomplete="off"/>

      <div class="choices two" id="produit"></div>
      <p class="note" data-i="note.episode"></p>

      <p class="note" id="produitNote"></p>
      <!-- Autres prestations : construites depuis la grille du client, aucune offre en dur. Vide = section masquée. -->
      <div class="more" id="moreWrap" hidden>
        <h3 data-i="x.more"></h3>
        <p class="sub" data-i="x.moreSub"></p>
        <div class="olist" id="moreOffers"></div>
      </div>
    </section>

    <!-- 2. Formule -->
    <section class="card panel" data-step="1">
      <h2 data-i="s2.title"></h2>
      <p class="hint" data-i="s2.hint"></p>
      <div class="choices two" id="formule"></div>
      <p class="note" id="formuleNote"></p>
    </section>

    <!-- 3. Extras -->
    <section class="card panel" data-step="2">
      <h2 data-i="s3.title"></h2>
      <p class="hint" data-i="s3.hint"></p>
      <!-- Ici, UNIQUEMENT ce qui s'ajoute par-dessus l'épisode. Single cam, multicam et face cam sont des
           épisodes (offers.family = episode / facecam) : ils vivent à l'étape 02, jamais ici. -->
      <div class="block" id="reelsBlock">
        <h3 data-i="x.reels"></h3><p class="sub" data-i="x.reelsSub"></p>
        <div class="choices two" id="reels"></div>
      </div>
      <div class="block" id="miniatureBlock">
        <h3 data-i="x.miniature"></h3><p class="sub" data-i="x.miniatureSub"></p>

        <div class="qty"><span class="lab" data-i="f.qty"></span><button type="button" data-dec="miniature">−</button><input type="number" min="0" max="99" data-q="miniature"/><button type="button" data-inc="miniature">+</button><span class="price" id="pMiniature" style="margin-left:10px"></span></div>
      </div>
      <div class="block" id="trailerBlock">
        <h3 data-i="x.trailer"></h3><p class="sub" data-i="x.trailerSub"></p>
        <div class="qty"><span class="lab" data-i="f.qty"></span><button type="button" data-dec="trailer">−</button><input type="number" min="0" max="99" data-q="trailer"/><button type="button" data-inc="trailer">+</button><span class="price" id="pTrailer" style="margin-left:10px"></span><button type="button" class="preview" data-prev="trailer" style="margin-left:14px"><i>▶</i><span data-i="preview"></span></button></div>
      </div>
      <div class="block">
        <label class="f" for="autre_demande" style="margin-top:0" data-i="f.autre_demande"></label>
        <input class="in" id="autre_demande" name="autre_demande" data-ph="ph.autre_demande"/>
      </div>
    </section>

    <!-- 4. Fichiers -->
    <section class="card panel" data-step="3">
      <h2 data-i="s4.title"></h2>
      <p class="hint" data-i="s4.hint"></p>
      <label class="f" data-i="f.rushes"></label>
      <div class="links" id="rushes"></div>
      <button type="button" class="add" data-add="rushes" data-i="add.link"></button>

        </div>
        <div>
          <div class="kh"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1-.2-2.2 1.1-2.2H17a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/></svg><span data-i="bk.palette"></span></div>
          <p class="ks" data-i="bk.paletteSub"></p>
          <label class="drop" id="dropPalette"><input type="file" accept="image/*" hidden data-file="palette"/><span class="up"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></span><span class="dl" data-i="bk.paletteDrop"></span></label>
          <input class="in" id="palette" name="palette" data-ph="ph.palette" style="margin-top:10px"/>
          <div class="swatches" id="swatches"></div>
        </div>
      </div>
      <div class="kh" style="margin-top:22px"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5h14M12 5v14M9 19h6"/></svg><span data-i="bk.font"></span></div>

      <label class="f" data-i="f.references"><small data-i="f.referencesSmall"></small></label>
      <div class="links" id="references"></div>

    <!-- 5. Brief -->
    <section class="card panel" data-step="4">
      <h2 data-i="s5.title"></h2>
      <p class="hint" data-i="s5.hint"></p>
      <label class="f" for="description" data-i="f.description"></label>
      <div class="chips" id="chips"></div>
      <textarea class="in" id="description" name="description" data-ph="ph.description"></textarea>
      <div class="row">

      <input class="in" id="autres" name="autres" data-ph="ph.autres"/>
    </section>

    <!-- 6. Récap -->
    <section class="card panel" data-step="5">
      <h2 data-i="s6.title"></h2>
      <p class="hint" data-i="s6.hint"></p>
      <div class="recap" id="recap"></div>
      <label class="terms" for="terms"><input type="checkbox" id="terms"/><span><span data-i="s6.terms"></span> <a id="termsLink" href="../conditions.html" target="_blank" rel="noopener" data-i="s6.termsLink"></a></span></label>

    <div class="nav">

      <div class="msg" id="msg"></div>
      <button type="button" class="btn ghost" id="prev" data-i="btn.prev"></button>
      <div class="summary" id="summary"></div>
      <button type="button" class="btn primary" id="next" data-i="btn.next"></button>

  </form>

  <section class="card success" id="success" style="display:none">
    <div class="ok">✓</div>
    <h2 class="display" data-i="ok.title"></h2>
    <p data-i="ok.text"></p>
    <div class="track" id="trackBox" style="display:none"><span class="mono" data-i="ok.track"></span><b id="trackToken"></b><small data-i="ok.trackHint"></small></div>

  </section>

const REELS = ["reel_basique", "reel_signature"];
const REEL_DB = { reel_basique: "reel_standard", reel_signature: "reel_premium" }; // clés locales de la page → clés de la base
/* ---------------- la commande : UN produit, UN épisode, des extras ----------------
   01 Produit = le TYPE de vidéo, sans prix. 02 Formule = l'épisode lui-même et son prix : une seule carte
   cochable, toutes familles confondues (podcast_*, vsl_*, single_cam_4k, multicam_4k, facecam_*, bundle_*).
   03 Extra = seulement ce qui s'ajoute PAR-DESSUS l'épisode (reels, miniature, trailer).
   Un seul champ `draft.offre` porte l'épisode : commander deux épisodes pour une vidéo est donc impossible. */
const PRODUITS = ["podcast", "vsl", "facecam"];
// Rattachement produit → épisode. La base ne porte PAS ce lien : `offers.family` dit seulement
// episode / bundle / facecam / vsl. Il se lit donc sur la clé (podcast_*, vsl_*, facecam_*), sur
// `offers.bundle_parts` pour un pack (bundle_standard contient podcast_standard, offers_v1c.sql l.41-45),
// et à la main pour single_cam_4k / multicam_4k, décrits en base comme un épisode de podcast ou
// d'interview (offers_v1.sql l.53-54 : « Single cam 4K edit », « Multicam 4K edit »).
const EP_FIX = { single_cam_4k: "podcast", multicam_4k: "podcast" };
const EP_FAMILIES = new Set(["episode", "bundle", "facecam", "vsl"]);
// Repli si la table `offers` est injoignable : la page continue de marcher avec ces clés-là.
const EP_FALLBACK = {
  podcast: ["podcast_standard", "podcast_premium", "single_cam_4k", "multicam_4k", "bundle_standard", "bundle_premium"],
  vsl: ["vsl_standard", "vsl_premium"],
  facecam: ["facecam_simple", "facecam_dynamique", "facecam_signature"],
};
const EP_ALL = new Set(Object.values(EP_FALLBACK).flat());
const BUNDLE_REELS = 3;                                                // repli si offers.bundle_reels_included n'est pas lu (seule constante de contenu de pack)
const offerOf = (k) => catalog.find((o) => o && o.item_key === k) || null;
const isBundle = (k) => { const o = offerOf(k); return o ? o.family === "bundle" : /^bundle_/.test(k || ""); };
function produitOf(k, deep) {
  if (EP_FIX[k]) return EP_FIX[k];
  const m = /^(podcast|vsl|facecam)_/.exec(k || ""); if (m) return m[1];
  if (!deep && isBundle(k)) {                                          // un pack appartient au produit de son épisode
    for (const p of Object.keys((offerOf(k) || {}).bundle_parts || {})) { const r = produitOf(p, true); if (r) return r; }
    return "podcast";
  }
  return null;
}
// Tous les épisodes rattachés à un produit, dans l'ordre de `offers.sort`, AVANT la grille du client.
function epAll(p) {
  const db = catalog.filter((o) => o && EP_FAMILIES.has(o.family) && produitOf(o.item_key) === p).map((o) => o.item_key);
  return db.length ? db : EP_FALLBACK[p] || [];
}
// Les épisodes RÉELLEMENT tarifés chez ce client : c'est cette liste qui décide du mode devis (quoteMode).
const epPriced = (p) => epAll(p).filter((k) => !dupHidden(k) && hasPrice(k));
// Les épisodes proposés pour un produit, filtrés par la grille du client.
const epKeys = (p) => epAll(p).filter(cardShown);
const epN = () => Math.min(99, Math.max(1, Number(draft.episodes) || 1));
const inclPer = () => { const n = Number((offerOf(draft.offre) || {}).bundle_reels_included); return Number.isFinite(n) && n > 0 ? n : BUNDLE_REELS; };
const inclTotal = () => (draft.offre && isBundle(draft.offre) ? inclPer() * epN() : 0);
const bundleReelKey = () => (/premium/.test(draft.offre || "") ? "reel_signature" : "reel_basique");
const minQty = (k) => (bundleReelKey() === k ? inclTotal() : 0);       // les reels inclus dans un pack ne se retirent pas
const maxQty = (k) => (LOCAL_QTY.has(k) ? 99 : MAX_MORE);              // cartes dédiées : 99 comme avant ; « Autres prestations » : 20
// Clés de prix renvoyées par client_prices (RPC) : null = inconnu (appel échoué ou pas de clé d'accès)
let avail = null;
const hasPrice = (k) => Number.isFinite(prices[k]);
/* Mode « Sur devis » : visiteur sans clé, RPC muette, ou client qui n'a AUCUNE VIDÉO COMMANDABLE —
   ni épisode tarifé, ni pack client tarifé. Le critère n'est plus « aucun prix du tout » : april-jackson
   a 11 lignes de grille à NULL et un seul prix posé (extra_30min, 30 $), ce qui suffisait à sortir du mode
   devis. Résultat observé : l'étape 01 ne proposait plus aucun type, 02 et 03 étaient vides, et la seule
   chose commandable était un supplément de 30 min — une commande sans vidéo. Un prix de supplément n'est
   pas une grille utilisable : ce client voit le formulaire complet en « Sur devis », comme the-move-miami.
   Dans ce mode on ne cache RIEN : un formulaire qui se vide est un deal perdu.
   Un client qui a des épisodes pour certains types seulement (studio-test : podcast et VSL, pas de face
   cam) ou seulement ses packs (recordia) reste en mode NORMAL : lui a bien une vidéo à commander, et seuls
   les types sans épisode tarifé disparaissent de 01. */
const quoteMode = () => !hasPacks() && !PRODUITS.some((p) => epPriced(p).length);
// Une carte disparaît si elle n'a pas de prix chez ce client (chacun ne voit que SA nomenclature) ou si elle
// doublonnerait un pack client déjà tarifé (anti-double facturation).
const cardShown = (k) => !dupHidden(k) && (quoteMode() || hasPrice(k));
// Promos pack (RPC client_bundle_promos) : { bundle_standard: {price, list, pct, cur}, … } ; absent = rien de barré, jamais de fausse promo
let promos = {};
const num = (x) => (x === null || x === undefined || x === "" ? NaN : Number(x));
/* Le format suit la LANGUE AFFICHÉE, jamais le pays de la devise. USD → « $1,234.50 » (inchangé).
   EUR → « 1 234,50 € » en français, « €1,234.50 » en anglais : un studio en euros lu en anglais
   affichait « 169,90 € », illisible pour un client américain. Devise inconnue → nombre seul, jamais un
   mauvais symbole. Les deux cas USD et EUR sont nommés ici, donc aucune devise n'hérite d'un autre format. */
const money = (x, cur) => { const v = Number(x), o = { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 }, loc = lang === "fr" ? "fr-FR" : "en-US"; return cur === "USD" ? "$" + v.toLocaleString("en-US", o) : cur === "EUR" ? (lang === "fr" ? v.toLocaleString("fr-FR", o) + " €" : "€" + v.toLocaleString("en-US", o)) : v.toLocaleString(loc, o); };
// LE prix affiché, partout : celui de la grille du client, à l'unité de CE qu'on vend (une vidéo, ou un pack
// avec son contenu détaillé juste en dessous). Jamais une moyenne « pack ÷ 4 vidéos » : elle mélangeait
// épisode et reels et trompait le client. Rien de posé pour ce client → « Sur devis ».
const unitPriceTxt = (k) => (hasPrice(k) ? money(prices[k], cur) : t("quote"));
function applyPromos(rows) {
  const out = {};
  if (Array.isArray(rows)) for (const r of rows) {
    const k = r && String(r.item_key || ""); if (!k) continue;
    const price = num(r.price), list = num(r.list_price), pct = num(r.save_pct);
    if (price > 0 && list > price && pct > 0) out[k] = { price, list, pct: Math.round(pct), cur: String(r.currency || "").toUpperCase() }; // sinon : pas de promo affichée
  }
  promos = out;
  if (!cur) { const withCur = Object.values(out).find((q) => q.cur); if (withCur) cur = withCur.cur; } // secours : devise lue sur une promo de bundle
  rerender();
}
/* ---------------- catalogue des offres (table `offers`, lecture publique) ----------------
   Aucune offre n'est écrite en dur ici : toute offre active qui a un prix chez CE client et qui n'a pas
   sa carte dédiée plus haut apparaît d'elle-même dans « Autres prestations ». Nouvelle offre en base = rien à retoucher. */
const CARD_KEYS = new Set(["podcast_standard", "podcast_premium", "vsl_standard", "vsl_premium", "single_cam_4k", "multicam_4k", "facecam_simple", "facecam_dynamique", "facecam_signature", "bundle_standard", "bundle_premium", "reel_standard", "reel_premium", "miniature", "trailer", "cta"]);
const LOCAL_QTY = new Set(["reel_basique", "reel_signature", "miniature", "trailer"]); // compteurs des cartes dédiées (clés propres à cette page)

let prices = {};      // prix de CE client : { item_key: unit_price } (client_prices)

// « episode » ni les « bundle » qui composent ces packs, même si un prix y a été resaisi par erreur. Sans pack : rien ne change.
const DUP_KEYS = new Set(["podcast_standard", "podcast_premium", "single_cam_4k", "multicam_4k", "bundle_standard", "bundle_premium"]); // repli si la famille n'est pas lue en base
const famOf = (k) => { const o = catalog.find((x) => x && x.item_key === k); return o ? o.family : null; };
const isDupFam = (k) => { const f = famOf(k); return f ? (f === "episode" || f === "bundle") : DUP_KEYS.has(k); };
const hasPacks = () => catalog.some((o) => o && o.family === "pack_client" && Number.isFinite(prices[o.item_key]));
const dupHidden = (k) => hasPacks() && isDupFam(k);
let cur = "";         // devise du studio : client_slug d'abord, client_bundle_promos en secours ; inconnue = nombre seul, jamais un mauvais symbole
const MAX_MORE = 20;  // compteur de 0 à 20
const offerLabel = (k) => { const o = catalog.find((x) => x.item_key === k); return (o && (lang === "fr" ? o.label_fr : o.label_en)) || k; };
const moreOffers = () => catalog
  .filter((o) => o && o.item_key && o.family !== "legacy" && !CARD_KEYS.has(o.item_key) && Number.isFinite(prices[o.item_key]) && !dupHidden(o.item_key))
  .slice()
  .sort((a, b) => ((a.family === "pack_client" ? 0 : 1) - (b.family === "pack_client" ? 0 : 1)) || (Number(a.sort ?? 9999) - Number(b.sort ?? 9999)) || String(a.item_key).localeCompare(String(b.item_key)));
const moreQty = () => { const out = {}; for (const o of moreOffers()) { const n = draft.qty[o.item_key] || 0; if (n > 0) out[o.item_key] = n; } return out; };
/* Garde-fou : une commande contient au moins UNE vidéo — l'épisode de l'étape 02, ou un pack / un
   épisode pris dans « Autres prestations ». Des suppléments seuls (30 min en plus, miniature, charte)
   ne font pas une commande : c'est ce qu'april-jackson pouvait envoyer. Contrôlé à la sortie de 03 ET
   avant l'envoi, donc on ne peut pas y arriver en revenant en arrière. */
const isVideoKey = (k) => { const f = famOf(k); return f ? (f === "pack_client" || EP_FAMILIES.has(f)) : EP_ALL.has(k); };
const hasVideo = () => !!draft.offre || Object.keys(moreQty()).some(isVideoKey);
// bundle_reels_included et bundle_parts sont lus EN BASE : le contenu d'un pack n'est jamais écrit ici.
// Si ces colonnes manquent (base plus ancienne), on retombe sur les colonnes d'origine et sur BUNDLE_REELS.
const CAT_COLS = "item_key,label_fr,label_en,family,sort,bundle_reels_included,bundle_parts";
async function loadCatalog() {
  let last = 0;
  for (const cols of [CAT_COLS, "item_key,label_fr,label_en,family,sort"]) {
    const r = await fetch(`${SB_URL}/rest/v1/offers?select=${cols}&active=is.true&order=sort`, { headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } });
    if (r.ok) return r.json();
    last = r.status; if (r.status !== 400) break;                      // 400 = colonne inconnue, on retente ; autre erreur = on sort
  }
  throw new Error("http_" + last);
}
/* Contenu RÉEL d'un pack, ligne par ligne, au prix unitaire de la grille du client (`offers.bundle_parts`).
   Prix barré = somme des parts, affiché UNIQUEMENT si chaque part a un prix chez ce client (sinon on
   annoncerait une économie inventée). Même mise en forme pour les bundles et pour les packs client
   (rec_niveau_*, offers_v1d.sql l.86-93) : deux packs équivalents s'affichent pareil. */
function partsHtml(k) {
  const o = offerOf(k), parts = o && o.bundle_parts && typeof o.bundle_parts === "object" ? o.bundle_parts : null;
  const ent = parts ? Object.entries(parts).filter(([, n]) => Number(n) > 0) : [];
  if (!ent.length) return "";
  let sum = 0, all = true;
  const rows = ent.map(([pk, n]) => {
    const qn = Number(n), up = prices[pk], priced = Number.isFinite(up);
    if (priced) sum += Math.round(qn * up * 100) / 100; else all = false;
    // Ligne sans prix dans la grille du client : jamais un prix inventé, jamais une ligne nue non plus
    // (observé : « 1 × Multicam 4K edit » tout seul dans rec_niveau_2 chez recordia). Elle est « inclus ».
    return `<div class="row"><span class="pq">${qn} ×</span><span class="pn">${esc(offerLabel(pk))}</span>${priced ? `<b>${esc(money(up, cur))}</b>` : `<span class="pct">${t("parts.incl")}</span>`}</div>`;
  }).join("");
  const pack = prices[k], rpc = promos[k];
  const promo = rpc ? { list: rpc.list, pct: rpc.pct, cur: rpc.cur || cur }
    : (all && Number.isFinite(pack) && sum > pack ? { list: sum, pct: Math.round((sum - pack) / sum * 100), cur } : null);
  const foot = promo ? `<div class="row"><span class="tag">${t("promo")}</span><span class="pct">${t("instead")}</span><s>${esc(money(promo.list, promo.cur))}</s><span class="pct">−${promo.pct}${lang === "fr" ? " %" : "%"}</span></div>` : "";
  return `<div class="parts">${rows}${foot}</div>`;
}

/* ---------------- les TROIS seuls gestes de sélection de la page ----------------
   Aucune carte n'écrit elle-même dans `draft` : tout passe par setProduit (01), setEpisode (02) ou
   toggleQty / setQty (compteurs). C'est ce qui garantit qu'une carte se dé-sélectionne au re-clic. */
// 01 : changer OU dé-cocher le produit remet l'étape 02 à zéro. Jamais une formule orpheline.
function setProduit(p) {
  const off = draft.produit === p;
  clearEpisode();
  if (off) delete draft.produit; else draft.produit = p;
  save(); rerender();

// 02 : UN seul épisode, toutes familles confondues. Deux épisodes pour une vidéo sont impossibles.
function setEpisode(k) {
  const off = draft.offre === k;
  clearEpisode();
  if (!off) { draft.offre = k; if (isBundle(k)) setBundleReels(); }
  save(); rerender();
}
const clearEpisode = () => { if (draft.offre && isBundle(draft.offre)) unsetBundleReels(); delete draft.offre; };
/* Les reels inclus dans un pack sont posés dans le compteur de l'étape 03 pour que le client les voie, et
   ils ne sont PAS facturés (voir order()). `bundlePrev` = ce qu'il avait avant le pack, `bundleBase` = ce
   que le pack a posé : au retrait du pack, on lui rend ses reels à lui et on retire seulement les inclus. */
function setBundleReels() {
  const k = bundleReelKey(), q = draft.qty;
  draft.bundlePrev = q[k] || 0;
  draft.bundleBase = Math.max(inclTotal(), draft.bundlePrev);
  q[k] = draft.bundleBase;
}
function unsetBundleReels() {
  const k = bundleReelKey(), q = draft.qty;
  const extra = Math.max(0, (q[k] || 0) - (draft.bundleBase || 0));     // les reels ajoutés PAR-DESSUS le pack restent
  q[k] = Math.max(0, (draft.bundlePrev || 0) + extra);
  delete draft.bundlePrev; delete draft.bundleBase;
}

function syncBundleReels() {
  if (!draft.offre || !isBundle(draft.offre)) return;
  const k = bundleReelKey(), q = draft.qty;
  const extra = Math.max(0, (q[k] || 0) - (draft.bundleBase || 0));
  draft.bundleBase = Math.max(inclTotal(), draft.bundlePrev || 0);
  q[k] = draft.bundleBase + extra;
}
function toggleQty(k) {
  const n = draft.qty[k] || 0, lo = minQty(k);
  draft.qty[k] = n > lo ? lo : Math.max(1, lo);                         // 0 ↔ 1, sans descendre sous les reels inclus d'un pack
  save(); rerender();
}

/* UN seul écouteur pour tous les compteurs (+, −, saisie), posé une fois pour toute la page.

/* ---------------- verrou anti-page-périmée ----------------
   Le site est sur GitHub Pages, qui sert les pages avec « Cache-Control: max-age=600 » et ne laisse pas
   régler ses en-têtes. Un client qui laisse son onglet ouvert garde donc indéfiniment l'ANCIENNE version du
   formulaire : s'il envoie depuis là, le payload est au format périmé (prix faux, voire double facturation).
   Aucune constante de version à maintenir à la main (source d'oubli garantie) : on compare l'empreinte HTTP
   de la page chargée à celle du serveur, par un HEAD.
   RÈGLE NON NÉGOCIABLE — fail-open : on ne bloque QUE sur la preuve positive que le serveur est plus récent.
   Réseau coupé, HEAD refusé, en-têtes absents, CORS, timeout, contrôle jamais initialisé : la commande part.
   Mieux vaut une commande qui passe qu'un client bloqué par un contrôle cassé. */
const STALE_MS = 2500;            // HEAD court : jamais une attente perceptible, même sur une connexion lente
let pageStamp = null;             // empreinte de la version que le client a sous les yeux : {etag, lm} ; null = pas de contrôle possible
let stale = false;                // une fois posé, seul un rechargement le lève
async function headStamp() {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), STALE_MS);
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store", signal: ctl.signal });
    if (!r.ok) return null;
    const etag = r.headers.get("ETag") || "", lm = r.headers.get("Last-Modified") || "";
    return etag || lm ? { etag, lm } : null;        // aucun en-tête exploitable : rien à comparer
  } catch { return null; }                          // réseau, CORS, timeout : on ne sait pas, donc on ne bloque pas
  finally { clearTimeout(timer); }
}
/* « Page périmée », dans cet ordre strict :
   1. LA TAILLE DU FICHIER, lue dans l'ETag. Mesuré sur ds-editing.com le 08/10 : GitHub Pages renvoie un
      ETag de la forme « <mtime en hex>-<taille en hex> » (depot.html "6ac68585-1c046" → 0x1c046 = 114758
      octets, exact au octet près sur les trois pages testées). On ne compare QUE le suffixe : il change
      quand le contenu change, et il ne bouge pas sur un simple re-commit qui ne touche que le mtime.
      Suffixes identiques → pas périmé, et on s'arrête là, même si le préfixe ou Last-Modified diffèrent.
   2. ETag sans cette forme (ou absent) → Last-Modified, périmé seulement s'il est STRICTEMENT plus récent ;
   3. à défaut seulement, repli sur l'ETag entier. Un ETag diffère légitimement d'un nœud CDN à l'autre : on
      ne bloque JAMAIS sur un simple écart d'ETag quand Last-Modified est disponible et identique ou plus ancien.
   Faux négatif assumé : une modification qui garderait EXACTEMENT la même taille d'octet passerait inaperçue
   si Last-Modified ne la rattrape pas. Improbable, et la règle du fail-open prime sur la détection. */
const lmTime = (s) => Date.parse(s || "");
const etagSize = (e) => { const m = /^(?:W\/)?"?[0-9a-f]+-([0-9a-f]+)"?$/i.exec(String(e || "").trim()); return m ? m[1].toLowerCase() : ""; };
function isStale(now) {
  if (!pageStamp || !now) return false;
  const sa = etagSize(pageStamp.etag), sb = etagSize(now.etag);
  if (sa && sb) return sa !== sb;                 // taille du fichier : critère principal, il tranche seul
  const a = lmTime(pageStamp.lm), b = lmTime(now.lm);
  if (Number.isFinite(a) && Number.isFinite(b)) return b > a;
  return !!(pageStamp.etag && now.etag && now.etag !== pageStamp.etag);
}
async function checkStale() {
  if (stale) return true;
  if (!pageStamp) return false;                     // contrôle indisponible depuis le chargement : on laisse passer
  if (!isStale(await headStamp())) return false;
  stale = true; renderStale();
  return true;
}

// Appel d'une RPC Supabase avec la clé publique. Erreur métier → e.code (bad_key, no_rushes…) ; base injoignable → e.offline.
async function rpc(fn, args) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 20000);
  let r;
  try { r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(args), signal: ctl.signal }); }
  catch (e) { const err = new Error("offline"); err.offline = true; throw err; }
  finally { clearTimeout(timer); }
  const txt = await r.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok) { const err = new Error((data && data.message) || "http_" + r.status); err.code = (data && data.message) || ""; err.offline = r.status >= 500; throw err; }
  return data;
}
// Même résumé lisible que le moteur (livrablesSummary de poll.mjs) : « 1 épisode podcast (16:9) · formule Premium · 10 reels standard (9:16) »
const DELIV = {
  fr: { podcast: ["épisode podcast", "épisodes podcast", "16:9"], vsl: ["VSL", "VSL", "16:9"], reels: ["reel standard", "reels standard", "9:16"], reels_signature: ["reel premium", "reels premium", "9:16"], intro: ["intro", "intros", ""], miniature: ["miniature", "miniatures", ""], trailer: ["trailer", "trailers", ""], single_cam: ["single cam 4K", "single cam 4K", "16:9"], multicam: ["multicam 4K", "multicam 4K", "16:9"], facecam: ["face cam", "face cam", "16:9"], bundle: ["bundle", "bundles", ""] },
  en: { podcast: ["podcast episode", "podcast episodes", "16:9"], vsl: ["VSL", "VSLs", "16:9"], reels: ["standard reel", "standard reels", "9:16"], reels_signature: ["premium reel", "premium reels", "9:16"], intro: ["intro", "intros", ""], miniature: ["thumbnail", "thumbnails", ""], trailer: ["trailer", "trailers", ""], single_cam: ["single-cam 4K", "single-cam 4K", "16:9"], multicam: ["multicam 4K", "multicam 4K", "16:9"], facecam: ["face cam", "face cam", "16:9"], bundle: ["bundle", "bundles", ""] },
};
function workToDo(d) {
  const out = [];
  const units = Math.max(1, Number(d.units) || 1), many = units > 1 ? units + " × " : "";
  for (const [key, [sing, plur, fmt]] of Object.entries(DELIV[lang])) {
    if (key === "facecam" || key === "bundle") {   // niveau choisi : « face cam Dynamique (16:9) », « 2 × bundle Premium (1 épisode + 3 reels inclus) »
      if (!d[key]) continue; const lvl = (key === "facecam" ? t("fclv") : t("bdlv"))[d[key]][0];
      const inc = inclPer(), pack = lang === "fr" ? `1 épisode + ${inc} reels inclus` : `1 episode + ${inc} reels included`;
      out.push(key === "facecam" ? `${many}${sing} ${lvl} (${fmt})` : `${many}${sing} ${lvl} (${pack})`); continue;
    }
    const raw = d[key] === true ? "1" : String(d[key] || "").trim(); if (!raw) continue;
    const n = parseInt(raw, 10);
    const label = Number.isFinite(n) ? `${n} ${n > 1 ? plur : sing}` : `${raw} ${plur}`;
    out.push(fmt ? `${label} (${fmt})` : label);
    if ((key === "podcast" || key === "vsl") && d.formule) out.push(`${lang === "fr" ? "formule" : "package"} ${d.formule}`);
  }
  // « Autres prestations » : libellé de l'offre lu en base (details.items), dans la langue de l'espace
  for (const [k, n] of Object.entries(d.items || {})) out.push(`${n} × ${offerLabel(k)}`);
  return out.join(" · ");
}
function autreDemande(v) { return [v.autre_demande, draft.cta === "yes" ? `${t("cta.unit")}${draft.ctaNets ? " : " + draft.ctaNets : ""}` : ""].filter(Boolean).join(" · "); }
// Liens en tableau ; un lien collé sans « https:// » est complété
function linkList(k) { return (draft[k] || []).flatMap((s) => String(s).split(/\s+/)).filter(Boolean).map((u) => (/^https?:\/\//i.test(u) ? u : (/^[\w-]+(\.[\w-]+)+([/?#]\S*)?$/.test(u) ? "https://" + u : u))); }
function order() {
  const v = values(); const q = draft.qty; const n = (x) => (x > 0 ? String(x) : "");
  const k = draft.offre || "", N = epN(), bundled = !!draft.offre && isBundle(k);
  const lv = (/_(standard|premium)$/.exec(k) || [])[1] || "";
  const items = Object.assign({}, moreQty());   // « Autres prestations » : { clé d'offre : quantité }
  /* price_job force la quantité 1 sur single_cam / multicam / facecam / bundle (offers_v1d.sql l.148-165).
     Pour N épisodes, les N−1 suivants passent par le chemin générique `items`, qui ADDITIONNE la quantité
     DANS la ligne existante au lieu d'en créer une deuxième (règle anti-doublon, offers_v1d.sql l.180-197).
     Résultat : une seule ligne de facture, à la bonne quantité, jamais un doublon. */
  if (N > 1 && (bundled || k === "single_cam_4k" || k === "multicam_4k" || k.startsWith("facecam_"))) items[k] = (items[k] || 0) + (N - 1);
  /* Les reels inclus dans un pack NE SE FACTURENT PAS. price_job déduit `bundle_reels_included` UNE fois
     (offers_v1d.sql l.167-168) : on lui envoie donc « extras du client + ce qu'il va déduire », et il
     reste exactement les extras à facturer. Un reel ajouté en plus du pack, lui, est bien facturé. */
  const reelN = (rk) => { const tot = q[rk] || 0; return bundled && bundleReelKey() === rk ? Math.max(0, tot - inclTotal()) + inclPer() : tot; };
  const details = {
    podcast: k.startsWith("podcast_") ? String(N) : "", vsl: k.startsWith("vsl_") ? String(N) : "",
    formule: /^(podcast|vsl)_/.test(k) && lv ? cap(lv) : "",
    reels: n(reelN("reel_basique")), reels_signature: n(reelN("reel_signature")), miniature: n(q.miniature), trailer: n(q.trailer),
    single_cam: k === "single_cam_4k", multicam: k === "multicam_4k",
    facecam: k.startsWith("facecam_") ? k.slice("facecam_".length) : null, bundle: bundled && lv ? lv : null,
    items,

    autre_demande: autreDemande(v), palette: v.palette, logos: v.logos,
    cta: draft.cta || "", cta_reseaux: draft.cta === "yes" ? (draft.ctaNets || "") : "", font: draft.font === "team" ? "team" : (draft.fontName || ""), autres: v.autres,
  };
  // Le brief du monteur annonce le nombre RÉEL de reels à produire (inclus compris), la facture non.
  const brief = Object.assign({}, details, { units: N, reels: n(q.reel_basique), reels_signature: n(q.reel_signature), single_cam: k === "single_cam_4k" ? String(N) : "", multicam: k === "multicam_4k" ? String(N) : "" });
  return { project: v.projet.trim(), email: v.email.trim(), contact: v.contact, lang, work_to_do: workToDo(brief), details, rushes_links: linkList("rushes"), references_links: linkList("references"), logos: v.logos, description: v.description, deadline: v.deadline, terms_accepted: $("#terms").checked, terms_text: t("s6.terms") };
}
const orderSlug = () => slug || (studio && studio.slug) || "";
const trackHref = () => `../suivi.html?token=${encodeURIComponent(orderToken)}&lang=${lang}`;
const keyMsg = (k) => `${esc(t("err")[k])} <a href="index.html?lang=${lang}">${esc(t("err").keyLink)}</a>`;
function done(token) {
  try { localStorage.removeItem(KEY); } catch {}
  orderToken = token || "";
  if (orderToken) { $("#trackToken").textContent = orderToken; $("#trackBox").style.display = ""; const a = $("#trackLink"); a.href = trackHref(); a.style.display = "inline-block"; }
  $("#form").style.display = "none"; $("#steps").style.display = "none"; $("#success").style.display = "block"; window.scrollTo({ top: 0, behavior: "smooth" });
}
async function submit() {
  const btn = $("#next");
  const fail = (html) => { $("#msg").innerHTML = html; btn.disabled = stale; btn.textContent = t("btn.send"); };
  if (!accessKey) return fail(keyMsg("key"));
  btn.disabled = true; btn.textContent = t("btn.sending");
  /* Le seul moment qui compte vraiment : si le serveur a une version plus récente, rien ne part au vieux
     format. Le bandeau prend le relais (#msg reste vide) et le bouton reste éteint jusqu'au rechargement.
     Contrôle cassé ou injoignable → checkStale() rend false et la commande part : fail-open. */
  if (await checkStale()) { btn.textContent = t("btn.send"); return; }
  try {
    const res = await rpc("create_order", { p_slug: orderSlug(), p_key: accessKey, p_order: order() });
    if (!res || !res.token) throw Object.assign(new Error("no_token"), { code: "send" });
    done(String(res.token));
  } catch (e) {
    // Pas de repli : le brouillon reste enregistré sur l'appareil, le client réessaie.
    if (e.offline) return fail(esc(t("err").send));
    if (e.code === "bad_key") return fail(keyMsg("bad_key"));
    fail(esc(["bad_email", "no_project", "no_rushes", "terms", "rate_limit"].includes(e.code) ? t("err")[e.code] : t("err").send));
  }
}
$("#again").addEventListener("click", () => location.reload());
const spaceKey = params.get("k"); if (spaceKey && slug) { const a = $("#spaceLink"); a.href = `espace.html?client=${encodeURIComponent(slug)}&k=${encodeURIComponent(spaceKey)}&lang=${lang}`; a.style.display = "inline-block"; }
$("#termsLink").href = `../conditions.html?lang=${lang}`;

applyText();

// Empreinte HTTP de la version chargée, prise tout de suite : c'est la référence du verrou anti-page-périmée.
// Échec → pageStamp reste null et le verrou ne bloquera jamais (fail-open).
headStamp().then((s) => { pageStamp = s; });

// Catalogue des offres : lu une fois, sans clé d'accès (lecture publique de `offers`).
// Échec ou table vide : aucune section « Autres prestations », tout le reste de la page marche comme avant.
loadCatalog().then((rows) => { if (Array.isArray(rows)) { catalog = rows; cleanDraft(); rerender(); } }).catch(() => {});

/* ---------------- accès : sans clé, on prévient tout de suite ; avec clé, on retrouve le nom et la langue du studio ----------------
   L'avertissement vit dans `accessWarn` et non dans #msg (vidé à chaque « Continuer ») : le client ne
   découvre plus à l'envoi, après six étapes, qu'il ne pouvait pas commander. */
if (!accessKey) { accessWarn = keyMsg("key"); renderNav(); }
else rpc("client_slug", { p_key: accessKey }).then((d) => {
  if (!d || !d.slug || (slug && d.slug !== slug)) { accessWarn = keyMsg("bad_key"); renderNav(); return; }
  studio = d;
  if (d.currency) cur = String(d.currency).toUpperCase(); // devise du studio : source principale (client_slug répond toujours)
  rpc("client_prices", { p_slug: d.slug, p_k: accessKey }).then(applyAvail).catch(() => {}); // échec ou vide : tout reste affiché
  rpc("client_bundle_promos", { p_slug: d.slug, p_k: accessKey }).then(applyPromos).catch(() => {}); // échec ou vide : aucune promo affichée
  if (!params.get("lang") && !langTouched && I18N[d.lang] && d.lang !== lang) { lang = d.lang; applyText(); } else $("#clientName").textContent = clientLabel();
}).catch(() => {}); // base injoignable : l'envoi tranchera
</script>
