<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="theme-color" content="#050607"/>
  <title>DS Editing — Exemples de production</title>
  <link rel="icon" type="image/png" href="../assets/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#050607;--surface:#0F1114;--surface-2:#161A1F;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.22);--cream:#F5F5F1;--taupe:#9AA3AD;--amber:#DCE3EA;--amber-soft:rgba(220,227,234,.12);--ok:#46D369;--err:#F08A82;--warn:#F5C400;--blue:#7FB0E0;--accent2:#B9C9DA;--chrome:linear-gradient(180deg,#FFFFFF 0%,#E3E7EC 38%,#9BA4AE 72%,#D6DBE0 100%);--chrome2:linear-gradient(95deg,#B9C9DA 0%,#7FA3CF 45%,#E6ECF2 100%);--glass:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));color-scheme:dark}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100%}
    body{background:radial-gradient(1200px 700px at 85% -5%,rgba(125,155,195,.16),transparent 60%),radial-gradient(900px 600px at -10% 40%,rgba(160,170,185,.08),transparent 60%),#050607;background-attachment:fixed;font-size:15px;line-height:1.55}
    a{color:inherit;text-decoration:none}
    .mono{font-family:'Geist',system-ui,sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums;color:var(--taupe)}
    .display{font-family:'Geist',system-ui,sans-serif;font-weight:600;letter-spacing:-.035em;text-transform:none;line-height:1.06;padding:.02em 0 .08em;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
    .display em,.display .ac{font-style:normal;background:var(--chrome2);-webkit-background-clip:text;background-clip:text;color:transparent}
    .app{min-height:100vh;display:flex;flex-direction:column}
    .app-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:61px;padding:12px 20px;background:rgba(8,9,11,.62);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid var(--line)}
    .app-header .brand{display:flex;flex-direction:column;justify-content:center;line-height:1.1;min-height:22px;padding-left:12px;border-left:1px solid var(--line)}
    .app-header .brand b{display:none} /* le nom est déjà porté par le logo « ● Rec » */
    .app-header .right{margin-left:auto;display:flex;align-items:center;gap:10px}
    .lv-rec{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:22px;letter-spacing:-.04em;line-height:1;color:var(--cream);white-space:nowrap}
    .lv-rec i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);animation:blink 1.6s infinite;margin-right:2px}
    .lv-rec em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--taupe);margin-left:2px}
    @keyframes blink{50%{opacity:.2}}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:999px;height:36px;padding:0 18px;font:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1;cursor:pointer;background:linear-gradient(180deg,#FFFFFF,#C9D0D7);color:#0A0B0D;box-shadow:inset 0 1px 0 #fff,0 8px 30px rgba(180,200,225,.18);white-space:nowrap;transition:background .2s,border-color .2s,box-shadow .2s}
    .btn:hover{background:linear-gradient(180deg,#fff,#E4E8EC)}
    .btn:empty{display:none} /* accès sans clé : le lien contact n'est pas encore rempli */
    .lang{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;height:32px;padding:0 12px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:border-color .2s,background .2s}
    .lang:hover{border-color:rgba(220,230,240,.35);background:rgba(255,255,255,.08)}
    .private{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;height:32px;padding:0 12px;font-size:12px;color:var(--taupe)}
    .private i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);font-style:normal}
    .btn:focus-visible,.lang:focus-visible,.type-item:focus-visible,.tier:focus-visible,.modal .bar button:focus-visible{outline:2px solid rgba(220,227,234,.6);outline-offset:2px}

    .app-main{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
    .sidebar{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01))}
    .sidebar .mono{padding:0 12px 12px}
    .type-item{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:border-color .2s,background .2s}
    .type-item b{font-size:15px;font-weight:600}
    .type-item span{font-size:12px;color:var(--taupe)}
    .type-item:hover{background:var(--surface);border-color:var(--line)}
    .type-item.active{background:var(--amber-soft);border-color:rgba(220,230,240,.5)}
    .type-item.active b{color:#fff}
    .type-item.active span{color:var(--accent2)}
    .content{padding:26px 28px 60px;min-width:0}
    .content h1{margin:0 0 4px;font-size:clamp(28px,4vw,44px)}
    .content .sub{margin:0 0 18px;color:var(--taupe);font-size:14px}
    .tier-tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tier{display:flex;flex-direction:column;gap:2px;min-width:150px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s}
    .tier b{font-size:15px;font-weight:600}
    .tier span{font-family:'Geist',system-ui,sans-serif;font-size:12px;color:var(--taupe);font-variant-numeric:tabular-nums}
    .tier:hover{border-color:var(--line-strong)}
    .tier.active{border-color:rgba(220,230,240,.5);background:var(--amber-soft)}
    .tier.active b{color:#fff}.tier.active span{color:var(--accent2)}
    .tier-desc{margin:14px 0 18px;color:var(--taupe);font-size:14px;line-height:1.5;max-width:70ch}
    .tier-desc em{font-style:normal;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
    .tier span{font-weight:600}
    .tier.unique{cursor:default}.tier.unique span{color:var(--blue,#7FB0E0)}
    .none-tier{grid-column:1/-1;border:1px solid var(--line);border-radius:18px;padding:34px 24px;text-align:center;background:linear-gradient(135deg,var(--surface),var(--surface-2))}
    .none-tier b{display:block;font-size:18px;font-weight:600;margin-bottom:6px}.none-tier span{color:var(--taupe);font-size:14px}
    .foot{margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--taupe);font-size:12.5px}.foot:empty{display:none}
    .video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .video-grid.vert{grid-template-columns:repeat(5,1fr)}
    @media (max-width:1100px){.video-grid.vert{grid-template-columns:repeat(4,1fr)}}
    @media (max-width:820px){.video-grid{grid-template-columns:repeat(2,1fr)}.video-grid.vert{grid-template-columns:repeat(3,1fr)}}
    .video-cell{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);cursor:pointer;transition:border-color .2s,box-shadow .2s}
    .video-cell:hover{border-color:var(--line-strong);box-shadow:0 12px 40px rgba(0,0,0,.45)}
    .video-grid.vert .video-cell,.video-cell.v{aspect-ratio:9/16}
    .video-grid:not(.vert) .video-cell.v{max-height:70vh;justify-self:start}
    .video-cell video{object-fit:contain;background:#000}
    .video-cell img,.video-cell video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .video-cell img{opacity:.85;transition:.3s}
    .video-cell:hover img{opacity:1;transform:scale(1.03)}
    .video-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(0deg,rgba(5,6,7,.78),transparent 45%)}
    .play-btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;color:#0A0B0D;font-size:18px;box-shadow:inset 0 1px 0 #fff,0 8px 30px rgba(0,0,0,.35);transition:.2s}
    .video-cell:hover .play-btn{transform:scale(1.06);background:#fff}
    .video-cell .cap{position:absolute;left:0;right:0;bottom:0;padding:12px;font-size:13px;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,.5)}
    .video-cell .cap span{display:block;font-size:11px;font-weight:400;color:var(--taupe)}
    .video-cell.playing .video-overlay,.video-cell.playing .cap,.video-cell.playing img{display:none}
    .video-cell.soon{cursor:default;background:linear-gradient(135deg,var(--surface),var(--surface-2));display:flex;align-items:center;justify-content:center;color:var(--taupe);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
    .gate{max-width:520px;margin:120px auto;text-align:center;color:var(--taupe);line-height:1.6;padding:0 20px}
    .modal{position:fixed;inset:0;z-index:50;background:rgba(5,6,7,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:16px}
    .modal.open{display:flex}
    .modal .box{width:min(1000px,100%);background:var(--glass),var(--surface);border:1px solid var(--line-strong);border-radius:22px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.6)}
    .modal .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:500}
    .modal .bar button{background:none;border:none;color:var(--taupe);font-size:20px;line-height:1;cursor:pointer;transition:color .2s}
    .modal .bar button:hover{color:var(--cream)}
    .modal iframe,.modal video{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000;max-height:80vh}
    @media (max-width:860px){.app-main{grid-template-columns:1fr;align-content:start}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px;display:flex;gap:6px;overflow-x:auto}.sidebar .mono{display:none}.sidebar #types{display:flex;gap:6px}.type-item{flex:none;padding:10px 12px}.type-item span{display:none}.content{padding:18px 16px 40px}.app-header .brand{display:none}.app-header .right{gap:8px}.private span{white-space:nowrap}}
    @media (max-width:480px){.app-header{padding:12px 16px;gap:10px}.private{display:none}.app-header .right{gap:6px;min-width:0}.app-header .btn{padding:0 14px;font-size:13px;height:32px}}

    /* ---- Scène « bientôt » (types sans exemple : portfolio.js → soon) : l'orbe ● du logo, en volume, entre et présente l'offre ---- */
    .soon-host{display:block}
    .soon-scene{position:relative;display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;min-height:360px;padding:44px 48px;border:1px solid var(--line);border-radius:22px;background:var(--glass),var(--surface);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
    .soon-scene::before{content:"";position:absolute;inset:auto auto -40% -10%;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(185,201,218,.16),transparent 62%);pointer-events:none}
    .soon-stage{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
    .orb{position:relative;width:132px;height:132px;border-radius:50%;
      background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.98) 0,rgba(255,255,255,.7) 9%,rgba(255,255,255,0) 30%),radial-gradient(circle at 50% 48%,#F7F7F3 0%,#DDE2E7 42%,#A6AFB8 76%,#6F7881 100%);
      box-shadow:inset -16px -20px 34px rgba(10,12,16,.42),inset 9px 12px 22px rgba(255,255,255,.4),0 26px 50px rgba(0,0,0,.55),0 0 70px rgba(220,227,234,.14);
      animation:orb-in 1.4s cubic-bezier(.2,.8,.2,1) both,orb-bob 3.4s ease-in-out 1.4s infinite}
    .orb::after{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 70% 82%,rgba(185,201,218,.35),transparent 45%);pointer-events:none}
    .orb-shadow{position:absolute;left:50%;bottom:22px;width:110px;height:18px;margin-left:-55px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);filter:blur(3px);animation:shadow-in 1.4s cubic-bezier(.2,.8,.2,1) both,shadow-bob 3.4s ease-in-out 1.4s infinite}
    .orb-eyes{position:absolute;left:50%;top:44%;display:flex;gap:16px;transform:translate(-50%,-50%);animation:eyes-in .4s ease-out 1.15s both,eyes-look .7s cubic-bezier(.3,.7,.2,1) 1.9s both}
    .eye{position:relative;width:13px;height:20px;border-radius:50%;background:#0A0B0D;box-shadow:inset 0 -2px 3px rgba(255,255,255,.12);animation:eye-blink 4.2s ease-in-out 2.6s infinite}
    .eye::after{content:"";position:absolute;left:3px;top:3px;width:4px;height:5px;border-radius:50%;background:#fff;opacity:.9}
    .badge{position:absolute;right:-6px;bottom:2px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#FFFFFF,#C9D0D7);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(0,0,0,.45);animation:pop .55s cubic-bezier(.3,1.6,.4,1) 2.2s both}
    .badge svg{margin-left:2px}
    .spark{position:absolute;width:18px;height:18px;background:radial-gradient(circle,#fff 0,#E3E7EC 40%,rgba(227,231,236,0) 70%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:pop .5s cubic-bezier(.3,1.6,.4,1) both,twinkle 2.2s ease-in-out infinite}
    .spark.s1{right:-12px;top:6px;animation-delay:2.1s,2.6s}
    .spark.s2{left:-16px;top:38px;width:12px;height:12px;animation-delay:2.35s,3s}
    .spark.s3{right:14px;top:-16px;width:14px;height:14px;animation-delay:2.55s,3.3s}
    .soon-copy{position:relative;min-width:0}
    .soon-copy .mono{margin-bottom:10px}
    .soon-copy h2{margin:0 0 12px;font-size:clamp(26px,3.2vw,40px)}
    .soon-copy p{margin:0 0 22px;color:var(--taupe);font-size:15px;line-height:1.55;max-width:52ch}
    .soon-copy>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
    .soon-copy>:nth-child(1){animation-delay:1.55s}.soon-copy>:nth-child(2){animation-delay:1.7s}.soon-copy>:nth-child(3){animation-delay:1.85s}.soon-copy>:nth-child(4){animation-delay:2.05s}
    @keyframes orb-in{0%{transform:translateX(-160%) translateY(-20px)}52%{transform:translateX(4%) translateY(0) scale(1)}62%{transform:translateX(3%) translateY(-22px) scale(.97,1.04)}74%{transform:translateX(1%) translateY(0) scale(1.07,.93)}86%{transform:translateY(-7px) scale(.99,1.01)}100%{transform:translate(0,0) scale(1)}}
    @keyframes orb-bob{50%{transform:translateY(-7px)}}
    @keyframes shadow-in{0%,50%{opacity:0;transform:scale(.4)}74%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
    @keyframes shadow-bob{50%{transform:scale(.92);opacity:.75}}
    @keyframes eyes-in{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    @keyframes eyes-look{to{transform:translate(calc(-50% + 9px),calc(-50% - 2px))}}
    @keyframes eye-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
    @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
    @keyframes twinkle{50%{opacity:.35;transform:scale(.7) rotate(25deg)}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media (max-width:820px){.soon-scene{grid-template-columns:1fr;justify-items:center;text-align:center;padding:32px 20px;gap:12px}.soon-stage{width:160px;height:170px}.orb{width:108px;height:108px}.orb-shadow{width:90px;margin-left:-45px;bottom:16px}.soon-copy{justify-self:stretch;width:100%}.soon-copy p{max-width:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    /* ---- Parcours d'ouverture (portfolio.js → gift) : témoignage → « Voir les tarifs » → cadeau (numéro) → prix barrés ---- */
    .gift{position:fixed;inset:0;z-index:60;background:rgba(5,6,7,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
    .gift.open{display:flex}
    .gift .box{position:relative;width:min(440px,100%);margin:auto;background:var(--glass),var(--surface);border:1px solid var(--line-strong);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.6);padding:22px 22px 20px;text-align:center;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
    .gift .x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--taupe);font-size:22px;line-height:1;cursor:pointer;padding:4px}
    .gift .x:hover{color:var(--cream)}
    .gift .mono{margin-bottom:8px}
    .gift h2{margin:0 0 8px;font-size:clamp(24px,5vw,30px)}
    .gift p{margin:0 0 16px;color:var(--taupe);font-size:14.5px;line-height:1.5}
    .gift .vid{position:relative;width:min(100%,calc(48vh * 9 / 16));aspect-ratio:9/16;margin:0 auto 16px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
    .gift .vid iframe,.gift .vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
    .gift .vid video{object-fit:cover;background:#000}
    .gift .btn{height:44px;padding:0 24px;font-size:15px;width:100%}
    .gift .skip{display:inline-block;margin-top:12px;background:none;border:none;color:var(--taupe);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
    .gift .skip:hover{color:var(--cream)}
    .gift form{display:flex;flex-direction:column;gap:10px;text-align:left}
    .gift label{font-size:12px;font-weight:600;color:var(--taupe)}
    .gift input{width:100%;height:44px;margin-top:4px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);color:var(--cream);font:inherit;font-size:15px}
    .gift input:focus{outline:none;border-color:rgba(220,230,240,.6);background:rgba(255,255,255,.07)}
    .gift .err{min-height:18px;margin:0;color:var(--err);font-size:13px}
    .gift .note{margin:2px 0 0;font-size:12px;text-align:center}
    .gift .gift-ic{width:64px;height:64px;margin:4px auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(180deg,#FFFFFF,#C9D0D7);box-shadow:inset 0 1px 0 #fff,0 10px 30px rgba(180,200,225,.25);animation:pop .55s cubic-bezier(.3,1.6,.4,1) .1s both}
    .tier s,.tier-desc s{text-decoration-thickness:1.5px;opacity:.75}
    .tier .free{display:block;margin-top:2px;font-size:11px;font-weight:600;font-style:normal;color:var(--ok)}
    .tier-desc .free{color:var(--ok);font-weight:600}
    #giftBtn{white-space:nowrap}
    @media (max-width:480px){.lv-rec em{display:none}.app-header .lang{padding:0 10px;font-size:12px}.app-header .btn{padding:0 12px;font-size:12.5px}}
    @media (max-width:400px){.lv-rec{font-size:19px}.app-header{padding:10px 12px;gap:8px}}
  </style>
  <link href="/css/ds-consent.css" rel="stylesheet"/>
</head>
<body>
<div class="app" id="app">
  <header class="app-header">
    <span class="lv-rec"><i></i>DS<em>Editing</em></span>
    <div class="brand"><b>DS Editing</b><small class="mono" data-t="sub"></small></div>
    <div class="right"><span class="private"><i></i><span data-t="private"></span></span><button class="lang" id="giftBtn" type="button" data-t="g1Btn" hidden></button><button class="lang" id="langBtn" type="button">EN</button><a class="btn" id="contact" href="#" data-t="contact"></a></div>
  </header>
  <div class="app-main" id="main">
    <nav class="sidebar"><div class="mono" data-t="types"></div><div id="types"></div></nav>
    <div class="content">
      <h1 class="display" id="typeTitle"></h1>
      <p class="sub" id="typeSub"></p>
      <div class="tier-tabs" id="tiers"></div>
      <p class="tier-desc" id="tierDesc"></p>
      <div class="video-grid" id="grid"></div>
      <p class="foot" id="foot"></p>
    </div>
  </div>
  <div class="gate" id="gate" hidden></div>
</div>
<div class="modal" id="modal"><div class="box"><div class="bar"><span id="modalTitle"></span><button type="button" id="modalClose">×</button></div><div id="modalMedia"></div></div></div>

<script>
(function () {

      soonKicker: "Bientôt dans le portfolio", soonTitle: "On le fait déjà.", soonText: "Nos exemples {type} arrivent. Pas besoin d'attendre : envoyez-nous un projet, le premier montage est offert.", soonBtn: "Premier montage offert",
      soonSubject: "Premier montage offert — {type}", soonBody: "Bonjour Cyriaque,\n\nJe souhaite tester DS Editing sur un projet {type}.\n\n",

  // Type demandé dans le lien (?type=…) : un type fusionné (ex. ads → vsl) ou inconnu retombe sur un type existant

  const land = (!params.get("type") && P.landing) || {};

  const G = P.gift || null;
  const store = { get: () => { try { return localStorage.getItem("ds_gift"); } catch { return null; } }, set: (v) => { try { v == null ? localStorage.removeItem("ds_gift") : localStorage.setItem("ds_gift", v); } catch {} } };

  const RPC = "https://xkanmjlpysxpohsuqvwg.supabase.co/rest/v1/rpc/site_lead_add", SB_KEY = "sb_publishable_lIZtV_WtN5NcGSb0dnfaiQ_AgKYBIVa"; // clé publique (anon), règles dans la RPC
  function sendLead(phone, podcast) {
    const vt = (() => { try { return sessionStorage.getItem("ds_visit_started") === "1" && localStorage.getItem("ds_team") !== "1" ? sessionStorage.getItem("ds_visit") : null; } catch { return null; } })(); // relie le lead à la visite (js/ds-track.js)

    const a = fetch(RPC, { method: "POST", keepalive: true, headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p }) }).catch(() => {});
    const b = fetch("https://formsubmit.co/ajax/contact@ds-editing.com", { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ _subject: `Portfolio : cadeau débloqué — ${podcast}`, Téléphone: phone, Podcast: podcast, Langue: lang, _template: "table", _captcha: "false" }) }).catch(() => {});
    return Promise.all([a, b]);
  }
  const phoneOk = (s) => { const d = s.replace(/\D/g, ""); return /^\+?[\d\s().-]+$/.test(s.trim()) && d.length >= 8 && d.length <= 15; };
  // Vidéo du témoignage dans la langue de la page, sinon la version FR (gift.src / gift.poster = chaîne ou { fr, en })
  const giftSrc = (k) => { const v = G && G[k]; return !v ? "" : typeof v === "string" ? v : v[lang] || v.fr || ""; };
  function giftOpen(step, data) {
    const t = T[lang], box = $("#giftBox"); data = data || {};
    const fill = (s) => s.replace("{studio}", esc(G.studio)).replace("{phone}", esc(data.phone || "")).replace("{podcast}", esc(data.podcast || ""));

      <div class="vid">${giftSrc("src") ? `<video src="${esc(giftSrc("src"))}" poster="${esc(giftSrc("poster"))}" controls playsinline preload="metadata" title="${esc(G.studio)}"></video>`
        : `<iframe src="${esc(G.video)}" allow="autoplay; fullscreen" allowfullscreen title="${esc(G.studio)}"></iframe>`}</div>
      <button class="btn" type="button" data-next>${t.g1Btn}</button><button class="skip" type="button" data-close>${t.skip}</button>`;
    if (step === 2) box.innerHTML = `<button class="x" type="button" data-close aria-label="×">×</button>
      <div class="gift-ic" aria-hidden="true">🎁</div><div class="mono">${t.g2Kicker}</div><h2 class="display" id="giftTitle">${t.g2Title}</h2><p>${t.g2Text}</p>
      <form novalidate><label>${t.phone}<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="${t.phonePh}" required/></label>

    if (step === 3) box.innerHTML = `<button class="x" type="button" data-close aria-label="×">×</button>
      <div class="gift-ic" aria-hidden="true">🎁</div><div class="mono">${t.g3Kicker}</div><h2 class="display" id="giftTitle">${t.g3Title}</h2><p>${fill(t.g3Text)}</p>
      <button class="btn" type="button" data-close>${t.g3Btn}</button>`;
    box.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", giftClose));
    const next = box.querySelector("[data-next]"); if (next) next.addEventListener("click", () => giftOpen(2));
    const form = box.querySelector("form");
    if (form) {
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const phone = form.phone.value.trim(), podcast = form.podcast.value.trim(), err = form.querySelector(".err"), btn = form.querySelector("button[type=submit]");
        if (!phoneOk(phone)) { err.textContent = t.errPhone; form.phone.focus(); return; }
        if (!podcast) { err.textContent = t.errPodcast; form.podcast.focus(); return; }
        err.textContent = ""; btn.disabled = true; btn.textContent = t.sending;
        sendLead(phone, podcast).finally(() => { unlocked = true; store.set("1"); render(); giftOpen(3, { phone, podcast }); });
      });
      setTimeout(() => form.phone.focus(), 50);
    }
    $("#gift").classList.add("open"); document.body.style.overflow = "hidden";
  }
  function giftClose() { $("#gift").classList.remove("open"); $("#giftBox").innerHTML = ""; document.body.style.overflow = ""; }
  $("#gift").addEventListener("click", (e) => { if (e.target.id === "gift") giftClose(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#gift").classList.contains("open")) giftClose(); });

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t] || ""; });

    $("#giftBtn").hidden = !G || unlocked;
    $("#contact").href = P.contactPhone ? `https://wa.me/${P.contactPhone.replace(/\D/g, "")}` : `mailto:${P.contactEmail}`;
    $("#types").innerHTML = P.types.map((ty) => `<div class="type-item ${ty.slug === type ? "active" : ""}" data-type="${ty.slug}"><b>${ty[lang][0]}</b><span>${ty[lang][1]}</span></div>`).join("");
    $("#types").querySelectorAll("[data-type]").forEach((el) => el.addEventListener("click", () => { type = el.dataset.type; render(); }));
    const ty = P.types.find((x) => x.slug === type);
    $("#typeTitle").textContent = ty[lang][0]; $("#typeSub").textContent = ty[lang][1];
    const prices = P.prices[type] || {};
    // portfolio.js → hidePrices : aucun prix nulle part (onglets, description, pied, scène « bientôt »)
    // … sauf une fois le cadeau débloqué (parcours gift) : les prix s'affichent, barrés, avec « 1er montage offert »
    const hide = P.hidePrices && !unlocked;
    const show = (p) => (hide ? "" : p);
    const fmt = (p) => (unlocked ? `<s>${esc(p)}</s>` : esc(p));
    // Formules visibles pour ce type (portfolio.js → hiddenTiers) ; si la formule courante est masquée, on repart sur la première
    const tiers = P.tiers.filter((ti) => !((P.hiddenTiers || {})[type] || []).includes(ti.slug));
    if (!tiers.some((ti) => ti.slug === tier)) tier = tiers[0].slug;
    // Type à formule unique (portfolio.js → prices[type].unique) : un seul onglet « Formule unique », toutes ses vidéos ensemble.

    const unique = prices.unique || "";

    const tiered = !unique && ofType.some((it) => it.tier) && !(ty.also && ofType.some((it) => !it.tier));

      : `<div class="none-tier"><b>${t.noneTier}</b>${price ? `<span>${t.noneTierSub.replace("{p}", esc(price))}</span>` : ""}</div>`;
    if (items.length) { const f = unique ? t.unique.toLowerCase() : tiers.find((x) => x.slug === tier)[lang][0].toLowerCase(); $("#foot").textContent = `${(items.length === 1 ? t.count1 : t.countN).replace("{n}", items.length).replace("{f}", f)}${price ? ` · ${t.footPrice}` : ""}`; }
    grid.querySelectorAll(".video-cell[data-i]").forEach((cell) => cell.addEventListener("click", () => play(cell, items[+cell.dataset.i])));
  }
  // Scène « bientôt » : orbe ● du logo (yeux, rebond, clin d'œil) + accessoire selon le type, texte et bouton mail
  function soonScene(ty, price) {

  $("#giftBtn").addEventListener("click", () => giftOpen(2));

  if (G && !unlocked && params.get("gift") !== "0") giftOpen(1);
