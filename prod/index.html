<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#050607"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>DS Editing — Rapport du jour</title>
  <link rel="icon" type="image/png" href="../assets/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#050607;--surface:#0F1114;--surface-2:#161A1F;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.22);--cream:#F5F5F1;--taupe:#9AA3AD;--amber:#DCE3EA;--amber-soft:rgba(220,227,234,.12);--ok:#46D369;--err:#F08A82;--warn:#F5C400;--chrome:linear-gradient(180deg,#FFFFFF 0%,#E3E7EC 38%,#9BA4AE 72%,#D6DBE0 100%);--chrome2:linear-gradient(95deg,#B9C9DA 0%,#7FA3CF 45%,#E6ECF2 100%)}
    *{box-sizing:border-box}
    html,body{margin:0;color:var(--cream);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(1200px 700px at 85% -5%,rgba(125,155,195,.16),transparent 60%),radial-gradient(900px 600px at -10% 40%,rgba(160,170,185,.08),transparent 60%),#050607;background-attachment:fixed}
    a{color:inherit}
    button{font:inherit;cursor:pointer}
    [hidden]{display:none!important}
    .mono{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--taupe);font-variant-numeric:tabular-nums}
    .display{font-weight:600;letter-spacing:-.035em;line-height:.98;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
    header{position:sticky;top:0;z-index:20;background:rgba(8,9,11,.62);backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid var(--line)}
    .hd{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
    .brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-decoration:none}
    .lv-rec{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:22px;letter-spacing:-.04em;line-height:1;color:var(--cream);white-space:nowrap}
    .lv-rec i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);animation:blink 1.6s infinite;margin-right:2px}
    .lv-rec em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--taupe);margin-left:2px}
    @keyframes blink{50%{opacity:.2}}
    .brand .mono{font-size:10px;color:#B9C9DA}
    .seg{margin-left:auto;display:flex;padding:3px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(16px)}
    .seg button{border:0;background:transparent;color:var(--taupe);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;transition:.15s}
    .seg button:hover{color:var(--cream)}
    .seg button.on{background:rgba(255,255,255,.9);color:#0A0B0D}
    @media(max-width:400px){.seg button{padding:6px 8px;font-size:11px}}
    main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:34px 16px 70px}
    h1{margin:0 0 10px;font-size:clamp(36px,7vw,54px)}
    .when{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .lead{margin:0;color:var(--taupe);font-size:15px;line-height:1.55}
    .datebox{margin-top:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .datebox label{margin:0;font-size:13px;color:var(--taupe)}
    .datebox input{height:40px;padding:0 12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;color:var(--cream);font:inherit;font-size:15px;color-scheme:dark;font-variant-numeric:tabular-nums}
    .datebox input:focus{outline:none;border-color:rgba(220,227,234,.6);box-shadow:0 0 0 3px rgba(220,227,234,.14)}
    .hint{margin:0;font-size:13px;color:var(--taupe);line-height:1.5}
    .hint.warn{color:var(--warn);width:100%}
    .sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 10px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09);border-radius:22px;backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);padding:20px 16px}
    @media(min-width:600px){.card{padding:24px}}
    .card+.card{margin-top:12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .ed{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--cream);font-size:15px;font-weight:600;text-align:left;transition:border-color .15s,background .15s}
    .ed:hover{border-color:var(--line-strong)}
    .ed:focus-visible{outline:none;border-color:rgba(220,230,240,.5);background:var(--amber-soft)}
    .av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
    .loading{grid-column:1/-1;color:var(--taupe);font-size:14px;padding:6px 2px}
    .me{display:flex;align-items:center;gap:12px;padding:14px 16px}
    .me strong{font-size:16px;font-weight:600}
    .me .ghost{margin-left:auto}
    .ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:15px;letter-spacing:-.01em;backdrop-filter:blur(16px);text-decoration:none;transition:.15s;white-space:nowrap}
    .ghost:hover{border-color:rgba(220,230,240,.35)}
    .ghost.sm{height:34px;padding:0 14px;font-size:12px}
    .ghost.wide{width:100%;margin-top:10px}
    .notice{margin:0 0 12px;padding:12px 16px;border-radius:14px;background:rgba(220,227,234,.08);border:1px solid rgba(220,227,234,.22);font-size:14px;line-height:1.5}
    .notice b{font-weight:600}
    .cat{--c:#DCE3EA;position:relative}
    .cat-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--c) 38%,transparent)}
    .ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .cat-name{flex:1;min-width:140px}
    .cat-name strong{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
    .cat-sub{display:flex;align-items:center;gap:8px;margin-top:5px}
    .tag{font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:var(--c);color:#fff}
    .ctr{display:flex;align-items:center;gap:6px;margin-left:auto}
    .ctr button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(255,255,255,.06);color:var(--cream);font-size:20px;line-height:1;display:grid;place-items:center;transition:.15s}
    .ctr button:hover{border-color:rgba(220,230,240,.5)}
    .ctr button[disabled]{opacity:.35;cursor:default}
    .ctr .plus{background:var(--c);border-color:transparent;color:#fff}
    .ctr input{width:56px;height:40px;padding:0;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;color:var(--cream);font:inherit;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s,box-shadow .15s}
    .ctr input:focus{border-color:rgba(220,227,234,.6);box-shadow:0 0 0 3px rgba(220,227,234,.14)}
    .cat-prog{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
    .cat-prog-l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
    .lbl{font-size:12px;color:var(--taupe);line-height:1.4}
    .lbl b{font-weight:600;color:var(--cream)}
    .pct{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--c)}
    .rg{-webkit-appearance:none;appearance:none;display:block;width:100%;height:6px;margin:8px 0;border-radius:999px;background:linear-gradient(90deg,var(--c) var(--p,0%),rgba(255,255,255,.12) var(--p,0%));outline:none;cursor:pointer}
    .rg::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#0F1114;border:3px solid var(--c);box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .15s}
    .rg::-webkit-slider-thumb:active{transform:scale(1.1)}
    .rg::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#0F1114;border:3px solid var(--c);box-shadow:0 2px 8px rgba(0,0,0,.5)}
    .rg::-moz-range-track{background:transparent}
    .rg:focus-visible{box-shadow:0 0 0 3px rgba(220,227,234,.14)}
    label{display:block;margin:0 0 8px;font-size:14px;font-weight:500}
    label small{font-weight:400;color:var(--taupe)}
    label+label,.ta+label{margin-top:16px}
    .in{width:100%;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;color:var(--cream);font:inherit;font-size:15px;line-height:1.5;outline:none;transition:border-color .15s,box-shadow .15s}
    .in::placeholder{color:rgba(154,163,173,.6)}
    .in:focus{border-color:rgba(220,227,234,.6);box-shadow:0 0 0 3px rgba(220,227,234,.14)}
    .in.bad{border-color:var(--err)}
    .ta{resize:vertical;min-height:96px}
    .ta.short{min-height:64px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;margin-top:18px;padding:0 24px;border:0;border-radius:999px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;background:linear-gradient(180deg,#FFFFFF,#C9D0D7);color:#0A0B0D;box-shadow:inset 0 1px 0 #fff,0 8px 30px rgba(180,200,225,.18);text-decoration:none;transition:.15s}
    .btn:hover{background:linear-gradient(180deg,#fff,#E4E8EC)}
    .btn[disabled]{opacity:.45;cursor:default}
    .msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--taupe);line-height:1.5}
    .msg.err{color:var(--err)}
    .done{text-align:center;padding:32px 20px}
    .check{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:rgba(70,211,105,.14);border:1px solid rgba(70,211,105,.35);color:var(--ok);display:grid;place-items:center}
    .check svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .done h2{margin:0 0 8px;font-size:34px}
    .done .sum{margin:0 0 6px;font-size:17px;font-weight:600}
    .done .hint{margin-bottom:6px}
    .back{margin:28px 0 0;text-align:center;font-size:14px;color:var(--taupe)}
    .back a{color:var(--cream);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
    /* liens Frame.io (un par vidéo terminée) et révisions */
    .links{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
    .lrow{display:flex;align-items:center;gap:8px}
    .lrow .n{flex:none;width:26px;font-size:12px;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}
    .lrow .in{padding:10px 12px;font-size:14px}
    .rev-card{--c:#7FA3CF}
    .rev{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px}
    .rev-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);color:var(--cream);font-size:18px;line-height:1}
    .rev-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media(max-width:420px){.rev-g{grid-template-columns:1fr}}
    .fl{display:block;margin:10px 0 6px;font-size:12px;color:var(--taupe)}
    .rev-g .fl{margin-top:0}
    select.in{-webkit-appearance:none;appearance:none;color-scheme:dark;padding:10px 12px;font-size:14px;background-image:linear-gradient(45deg,transparent 50%,#9AA3AD 50%),linear-gradient(135deg,#9AA3AD 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
    select.in option{background:#161A1F}
    .rev .in{padding:10px 12px;font-size:14px}
    .chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
    .chips button{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);color:var(--cream);font-size:13px;font-weight:600}
    .chips button.on{background:rgba(255,255,255,.9);color:#0A0B0D;border-color:transparent}
    .chips .min{width:74px;text-align:center}
    .chips.bad button,.chips.bad .min{border-color:var(--err)}
    footer{padding:24px 16px;text-align:center}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<header><div class="hd">
  <a class="brand" href="../index.html"><span class="lv-rec"><i></i>DS<em>Editing</em></span><span class="mono" data-t="sub"></span></a>
  <div class="seg" id="seg" role="group" aria-label="Bahasa · Langue · Language">
    <button type="button" data-l="id" lang="id">Bahasa</button><button type="button" data-l="fr" lang="fr">Français</button><button type="button" data-l="en" lang="en">English</button>
  </div>
</div></header>

<main>
  <h1 class="display" data-t="title"></h1>
  <div class="when">
    <p class="lead" id="dateText"></p>
    <button class="ghost sm" id="dateBtn" type="button" data-t="changeDate"></button>
  </div>
  <div class="datebox" id="dateBox" hidden>
    <label for="date" data-t="dateLabel"></label>
    <input type="date" id="date"/>
    <button class="ghost sm" id="todayBtn" type="button" data-t="today"></button>
    <p class="hint warn" id="otherDay" hidden data-t="otherDay"></p>
  </div>

  <section id="who">
    <div class="sec"><span class="mono" data-t="who"></span></div>
    <div class="card">
      <div id="editors" class="grid"><div class="loading" data-t="loading"></div></div>
      <div id="loadErr" class="msg err" hidden><span data-t="loadFail"></span> <button class="ghost sm" id="retry" type="button" data-t="retry"></button></div>
    </div>
  </section>

  <section id="me" hidden>
    <div class="card me"><span class="av" id="meAv"></span><strong id="meName"></strong><button class="ghost sm" id="notMe" type="button" data-t="notMe"></button></div>
  </section>

  <form id="report" hidden novalidate>
    <div class="sec"><span class="mono" data-t="produced"></span><span class="mono" id="sum" aria-live="polite"></span></div>
    <div class="notice" id="notice" hidden></div>
    <div id="cats"></div>
    <div class="sec"><span class="mono" data-t="revTitle"></span><span class="mono" id="revSum"></span></div>
    <div class="card rev-card">
      <p class="hint" data-t="revHint"></p>
      <div id="revs"></div>
      <button class="ghost wide" id="revAdd" type="button" data-t="revAdd"></button>
    </div>
    <div class="card">
      <label for="details" data-t="details"></label>
      <textarea id="details" class="in ta" rows="4" data-p="detailsPh"></textarea>
      <label for="comment"><span data-t="comment"></span> <small data-t="optional"></small></label>
      <textarea id="comment" class="in ta short" rows="2" data-p="commentPh"></textarea>
      <button class="btn" id="save" type="submit"><span data-t="save"></span></button>
      <div class="msg" id="msg" role="alert"></div>
    </div>
  </form>

  <section id="done" hidden>
    <div class="card done">
      <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 class="display" data-t="saved"></h2>
      <p class="sum" id="doneSum"></p>
      <p class="hint" id="doneMeta"></p>
      <a class="btn" href="../index.html" data-t="back"></a>
      <button class="ghost wide" id="editBtn" type="button" data-t="edit"></button>
    </div>
  </section>

  <p class="back"><a href="../index.html" data-t="back"></a></p>
</main>
<footer class="mono" data-t="footer"></footer>

    $("#revs").querySelectorAll(".rev").forEach((row, i) => {
      const r = state.revs[i], m = toInt(r.minutes), u = String(r.url || "").trim(), client = String(r.client || "").trim();
      if (!r.cat) fail("badRev", row.querySelector('[data-f="cat"]'));
      if (!r.studio_id && !client) fail("badRev", r.other ? row.querySelector('[data-f="other"]') : row.querySelector('[data-f="cli"]'));
      if (m < 1 || m > 240) fail("badRev", row.querySelector(".chips"));
      const ui2 = row.querySelector('[data-f="url"]');
      if (!u) fail("badRev", ui2); else if (!linkOk(u)) fail("badLink", ui2); else if (seen.has(u.toLowerCase())) fail("dupLink", ui2); else seen.add(u.toLowerCase());
      revisions.push({ cat: r.cat, studio_id: r.studio_id || null, client: r.studio_id ? null : client, minutes: m, url: u });
    });
    if (err) { msg.textContent = t[err]; msg.className = "msg err"; if (first) { first.scrollIntoView({ block: "center", behavior: "smooth" }); if (first.focus) first.focus({ preventScroll: true }); } return; }
    btn.disabled = true; msg.textContent = t.saving;
    try {
      const res = await rpc("prod_submit", { p_key: state.key, p_date: state.date, p_counts: state.counts, p_details: details, p_comment: comment, p_lang: lang, p_links: links, p_revisions: revisions });
      clearTimeout(draftTimer); store.del(draftKey());
      state.server = { updated_at: new Date().toISOString() }; state.draftUsed = false; state.last = res || { elements: el, in_progress: ip };
      msg.textContent = ""; showDone();
    } catch (err) {
      const m = String((err && err.message) || "");
      msg.textContent = /bad_date/.test(m) ? t.badDate : /bad_editor|bad_key/.test(m) ? t.badEditor : /\bempty\b/.test(m) ? t.empty
        : /need_links/.test(m) ? t.needLinks : /bad_link/.test(m) ? t.badLink : /dup_link/.test(m) ? t.dupLink : /bad_revision/.test(m) ? t.badRev : t.fail;
      msg.className = "msg err";
    } finally { btn.disabled = false; if (msg.textContent === t.saving) msg.textContent = ""; }
  }
  $("#report").addEventListener("submit", submit);
  function showDone() { $("#report").hidden = true; $("#me").hidden = true; $("#done").hidden = false; renderDone(); window.scrollTo({ top: 0 }); }
  $("#editBtn").addEventListener("click", () => { $("#done").hidden = true; $("#me").hidden = false; $("#report").hidden = false; renderNotice(); window.scrollTo({ top: 0 }); });

  // ---------- démarrage
  async function init() {
    render(); $("#loadErr").hidden = true; $("#editors").innerHTML = `<div class="loading">${T[lang].loading}</div>`;
    try {
      const [eds, cats, clis] = await Promise.all([rpc("prod_editors"), rpc("prod_categories_public"), rpc("prod_clients").catch(() => [])]);
      state.editors = Array.isArray(eds) ? eds : []; state.cats = Array.isArray(cats) ? cats : []; state.clients = Array.isArray(clis) ? clis : [];
      buildCats(); renderEditors(); render();
      const key = (params.get("e") || "").trim() || store.get("ds_prod_key");
      if (key) {
        const me = await rpc("prod_me", { p_key: key }); // erreur réseau → « Réessayer » ; null → clé inconnue ou remplacée
        if (me) { setKey(key); selectEditor(me); return; }
        store.del("ds_prod_key");
      }
      // appareil déjà utilisé avant les clés personnelles : on récupère la clé du monteur mémorisé, sans rien lui demander
      let rem = null; try { rem = JSON.parse(store.get("ds_prod_editor") || "null"); } catch { rem = null; }
      const found = rem && state.editors.find((e) => e.id === rem.id);
      if (found) await pickEditor(found);
    } catch (err) { $("#editors").innerHTML = ""; $("#loadErr").hidden = false; }
  }
  $("#retry").addEventListener("click", init);
  init();
</script>
</body>
