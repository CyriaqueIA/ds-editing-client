<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="theme-color" content="#0C0B10"/>
  <title>DS Editing — Production</title>
  <link rel="icon" type="image/png" href="../assets/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0C0B10;--surface:#16141A;--surface-2:#1D1A22;--line:rgba(237,232,220,.10);--line-strong:rgba(237,232,220,.22);--cream:#EDE8DC;--taupe:#8A8378;--amber:#FF6A2B;--amber-soft:rgba(255,106,43,.14);--ok:#5FD39A;--warn:#F5C400;--err:#F08A82;--blue:#7FB0E0;--av:44px}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--cream);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--taupe)}
    .display{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:1}
    button,input,select{font:inherit}
    .btn{border:none;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;background:var(--amber);color:#0C0B10}
    .btn.ghost{background:none;color:var(--taupe);border:1px solid var(--line)}
    .btn.ghost:hover{color:var(--cream);border-color:var(--line-strong)}
    .in,select.in{background:var(--bg);color:var(--cream);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;outline:none;width:100%}
    .in:focus{border-color:rgba(255,106,43,.6)}

    header{position:sticky;top:0;z-index:20;background:rgba(12,11,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .hd{display:flex;align-items:center;gap:14px;padding:12px 20px}
    .hd img{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(255,106,43,.4)}
    .hd .brand{display:flex;flex-direction:column;line-height:1.1}
    .hd .brand b{font-weight:600}
    .hd .right{margin-left:auto;display:flex;align-items:center;gap:10px}
    .clock{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--taupe)}
    .who{font-size:13px;color:var(--taupe)}
    .who b{color:var(--cream);font-weight:500}
    .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--taupe)}
    .live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}

    main{padding:18px 20px 60px}
    /* ---- barre des monteurs ---- */
    .edbar{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:16px}
    .ed{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
    .ed:hover{border-color:var(--amber)}
    .ed.on{border-color:var(--amber);background:var(--amber-soft);box-shadow:0 0 0 1px var(--amber) inset}
    .ed .nm{font-size:16px;font-weight:600;line-height:1}
    .ed .ct{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--taupe);margin-top:3px}
    .ed.on .ct{color:var(--amber)}
    .ed.all .av{background:var(--surface-2);color:var(--cream)}
    .av{width:var(--av);height:var(--av);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--av) * .38);color:#0C0B10;flex:none;overflow:hidden;letter-spacing:.02em}
    .av img{width:100%;height:100%;object-fit:cover}
    .av.sm{--av:30px}

    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
    @media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
    .stat .v{font-family:"Anton",Impact,sans-serif;font-size:32px;line-height:1;margin-top:6px}
    .stat.warn .v{color:var(--warn)}.stat.err .v{color:var(--err)}.stat.ok .v{color:var(--ok)}.stat.amber .v{color:var(--amber)}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .chip{border:1px solid var(--line-strong);background:none;color:var(--cream);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer}
    .chip.on,.chip:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
    .toolbar .search{margin-left:auto;width:240px}

    /* ---- lignes ---- */
    .board{display:flex;flex-direction:column;gap:8px}
    .job{display:grid;grid-template-columns:92px 1.3fr 210px 200px 1.1fr 160px 150px 40px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:12px;padding:10px 14px;font-size:13px;position:relative}
    .job.g{border-left-color:var(--ok)}.job.o{border-left-color:var(--warn)}.job.r{border-left-color:var(--err)}.job.done{border-left-color:var(--blue);opacity:.7}
    .job .tok{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--amber);font-weight:500}
    .job .tok small{display:block;color:var(--taupe);font-size:10px;font-weight:400;margin-top:3px;letter-spacing:.05em}
    .job .c b{display:block;font-weight:600;font-size:14px}
    .job .c em{display:block;font-style:normal;margin-top:2px}
    .job .c span{display:block;font-size:11px;color:var(--taupe);margin-top:3px}
    /* monteurs sur la ligne */
    .eds{display:flex;flex-direction:column;gap:6px;cursor:default}
    .eds.can{cursor:pointer}
    .eds .row{display:flex;align-items:center}
    .eds .row .av{margin-right:-8px;box-shadow:0 0 0 2px var(--surface)}
    .eds .names{font-size:12px;line-height:1.3}
    .eds .none{color:var(--taupe);font-size:12px;border:1px dashed var(--line-strong);border-radius:8px;padding:6px 10px;text-align:center}
    .eds.can .none:hover{border-color:var(--amber);color:var(--amber)}
    .pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:230px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:12px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:grid;grid-template-columns:1fr 1fr;gap:2px}
    .pop label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
    .pop label:hover{background:var(--amber-soft)}
    .pop input{accent-color:var(--amber)}
    .edcell{position:relative}
    /* date souhaitée + chrono */
    .due{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:10px;border:1px solid var(--line)}
    .due .k{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe)}
    .due .dt{font-family:"Anton",Impact,sans-serif;font-size:22px;line-height:1.05;letter-spacing:.01em}
    .due .cd{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:700;letter-spacing:.02em}
    .due .team{font-size:11px;color:var(--taupe)}
    .due.g{border-color:rgba(95,211,154,.35)}.due.g .cd{color:var(--ok)}
    .due.o{border-color:rgba(245,196,0,.45);background:rgba(245,196,0,.06)}.due.o .cd{color:var(--warn)}
    .due.r{border-color:rgba(240,138,130,.6);background:rgba(240,138,130,.10)}.due.r .cd,.due.r .dt{color:var(--err)}
    .due.done{opacity:.7}.due.done .cd{color:var(--blue)}
    .links a{display:inline-block;font-size:12px;color:var(--cream);border:1px solid var(--line);border-radius:7px;padding:4px 8px;margin:2px 4px 2px 0;text-decoration:none}
    .links a:hover{border-color:var(--amber);color:var(--amber)}
    .badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 7px;color:var(--taupe);border:1px solid var(--line)}
    .badge.ok{color:var(--ok);border-color:rgba(95,211,154,.4)}.badge.err{color:var(--err);border-color:rgba(240,138,130,.5)}
    .steps{display:flex;gap:6px;flex-wrap:wrap}
    .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;cursor:pointer;color:var(--taupe);user-select:none}
    .st.on{color:var(--ok);border-color:rgba(95,211,154,.4);background:rgba(95,211,154,.08)}
    .st.auto{cursor:default}
    .st[aria-disabled="true"]{cursor:not-allowed;opacity:.6}
    .qc{display:flex;flex-direction:column;gap:5px}
    .qc select{padding:6px 8px;font-size:12px}
    .qc.ok select{color:var(--ok)}.qc.revisions select{color:var(--err)}
    .more{background:none;border:1px solid var(--line);color:var(--taupe);border-radius:8px;width:32px;height:32px;cursor:pointer}
    .more:hover{color:var(--cream);border-color:var(--line-strong)}
    .detail{grid-column:1/-1;display:none;gap:14px;padding:10px 4px 4px;border-top:1px solid var(--line);margin-top:6px;font-size:13px;color:var(--taupe);grid-template-columns:1fr 1fr 1fr}
    .job.open .detail{display:grid}
    .detail b{display:block;color:var(--cream);font-weight:500;margin-bottom:4px}
    .detail .lk{white-space:pre-wrap;word-break:break-all;font-size:12px}
    .empty{padding:60px 20px;text-align:center;color:var(--taupe)}
    @media (max-width:1180px){.job{grid-template-columns:1fr 1fr 1fr;row-gap:10px}.job .detail{grid-template-columns:1fr}}

    /* onglets admin */
    .tabs{display:flex;gap:4px;margin-left:18px}
    .tab{background:none;border:1px solid transparent;color:var(--taupe);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
    .tab.on{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
    .admin{display:grid;gap:14px}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
    .panel h3{margin:0 0 10px;font-size:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
    .grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--taupe)}
    .grid input{width:100%}
    table.adm{width:100%;border-collapse:collapse;font-size:13px}
    table.adm th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);padding:8px 8px;border-bottom:1px solid var(--line)}
    table.adm td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
    .row-form{display:grid;grid-template-columns:1.2fr 2fr 80px 110px auto auto;gap:8px;align-items:end}
    .row-form label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--taupe)}
    .amount{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
    .amount .big{font-family:"Anton",Impact,sans-serif;font-size:20px}
    .amount .miss{color:var(--err);font-size:12px}
    /* mode télé */
    body.tv{--av:56px}
    body.tv main{padding:14px 18px}
    body.tv .toolbar,body.tv .more,body.tv .detail{display:none}
    body.tv .job{font-size:15px;padding:14px 16px;grid-template-columns:100px 1.3fr 250px 230px 1.1fr 170px 150px}
    body.tv .ed .nm{font-size:20px}
    body.tv .due .dt{font-size:28px}body.tv .due .cd{font-size:19px}
    body.tv .stat .v{font-size:44px}
    body.tv .hd .right .btn{display:none}

    /* connexion */
    .gate{max-width:380px;margin:90px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
    .gate h1{font-size:28px;margin:0 0 6px}
    .gate p{color:var(--taupe);font-size:14px;margin:0 0 16px}
    .gate .in{margin-bottom:10px}
    .gate .msg{font-size:13px;color:var(--err);min-height:18px;margin-top:8px}
  </style>
</head>
<body>
<header><div class="hd">
  <img src="../assets/logo.png" alt=""/>
  <div class="brand"><b>DS Editing</b><span class="mono" data-t="sub"></span></div>
  <span class="live" id="live" hidden><i></i><span data-t="live"></span></span>
  <div class="tabs" id="tabs" hidden></div>
  <div class="right">
    <span class="clock" id="clock"></span>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="langBtn" type="button">EN</button>
    <button class="btn ghost" id="tvBtn" type="button" data-t="tv"></button>
    <button class="btn ghost" id="logout" type="button" data-t="logout" hidden></button>
  </div>
</div></header>

<main>
  <div class="gate" id="gate" hidden>
    <h1 class="display" data-t="login"></h1>
    <p data-t="loginSub"></p>
    <input class="in" id="email" type="email" placeholder="email" autocomplete="username"/>
    <input class="in" id="password" type="password" placeholder="mot de passe" autocomplete="current-password"/>
    <button class="btn" id="loginBtn" type="button" data-t="loginBtn"></button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app" hidden>
    <div class="edbar" id="edbar"></div>
    <div class="stats" id="stats"></div>
    <div class="toolbar" id="toolbar"></div>
    <div class="board" id="board"></div>
    <div class="admin" id="admin" hidden></div>
  </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const T = {

    all: "Tous", tasks: (n) => `${n} tâche${n > 1 ? "s" : ""}`, stats: ["Reçues aujourd'hui", "En cours", "En retard", "À contrôler", "Livrées cette semaine"],

let lang = params.get("lang") || (() => { try { return localStorage.getItem("ds_lang"); } catch { return null; } })() || "fr"; if (!T[lang]) lang = "fr";

let me = null, profile = null, myEditor = null, jobs = [], editors = [], filter = params.get("f") || "all", edFilter = params.get("editor") || "", q = "", known = new Set(), sb = null;
let tab = params.get("tab") || "prod", studios = [], grids = [], invoicesAll = [], extras = [], tarifStudio = "";
const money = (x, cur) => x == null ? "—" : (cur === "USD" ? "$" + Number(x).toLocaleString("en-US", { minimumFractionDigits: 2 }) : Number(x).toLocaleString("fr-FR", { minimumFractionDigits: 2 }) + " €");

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const fmtD = (d) => d ? new Date(d).toLocaleDateString(loc(), { weekday: "short", day: "2-digit", month: "short" }) : "—";

function addBusinessDays(date, n) { const d = new Date(date); let k = 0; while (k < n) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) k++; } return d; }
const endOfDay = (d) => { const x = new Date(d); x.setHours(23, 59, 59, 0); return x; };
// cible du chrono : date souhaitée par le client, sinon date fixée par l'équipe, sinon +5 j ouvrés
function target(j) { if (j.requested_deadline) return endOfDay(j.requested_deadline + "T12:00:00"); if (j.delivery_date) return endOfDay(j.delivery_date + "T12:00:00"); return endOfDay(addBusinessDays(j.created_at, BUSINESS_DAYS_DEFAULT)); }
const isDone = (j) => j.qc_status === "ok";

}

async function loadAdmin() {
  if (!isAdmin()) return;
  const [a, b, c, d] = await Promise.all([sb.from("studios").select("*").order("name"), sb.from("price_grids").select("*"), sb.from("invoices").select("*").order("period_end", { ascending: false }).limit(300), sb.from("extra_lines").select("*").order("created_at", { ascending: false }).limit(200)]);
  studios = a.data || []; grids = b.data || []; invoicesAll = c.data || []; extras = d.data || [];
}

/* ===== données ===== */
async function load(first, keepPop) {
  const [{ data: rows, error }, { data: eds }] = await Promise.all([
    sb.from("jobs").select("*").order("created_at", { ascending: false }).limit(400),
    sb.from("editors").select("id,name,avatar_url,profile_id,active,sort").order("sort"),
    loadAdmin(),
  ]);
  if (error) { console.error(error); return; }
  if (!first) { const fresh = (rows || []).filter((j) => !known.has(j.id)); if (fresh.length) beep(fresh.length); }
  jobs = rows || []; editors = eds || []; jobs.forEach((j) => known.add(j.id));
  myEditor = editors.find((e) => e.profile_id === me.id) || null;
  if (first && !params.has("editor") && myEditor && profile.role === "editor") edFilter = myEditor.id;
  const openCell = keepPop && document.querySelector(".pop") ? document.querySelector(".pop").parentElement.querySelector("[data-eds]")?.dataset.eds : null;
  renderEditorBar(); renderStats(); renderBoard();
  if (openCell) { const cell = document.querySelector(`[data-eds="${openCell}"]`); if (cell) openPop(cell); }
}
function beep(n) {
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); for (let i = 0; i < Math.min(n, 3); i++) { const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = .08; o.start(ctx.currentTime + i * .25); o.stop(ctx.currentTime + i * .25 + .15); } } catch {}
}
async function boot() {
  applyText();
  sb = createClient(SUPABASE_URL, SUPABASE_ANON);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("#gate").hidden = false; return; }
  me = session.user;
  const { data: p } = await sb.from("profiles").select("*").eq("id", me.id).single();
  profile = p || { role: "editor", display_name: me.email };
  $("#who").innerHTML = `<b>${esc(profile.display_name)}</b> · ${esc(profile.role)}`;
  $("#logout").hidden = false; $("#gate").hidden = true; $("#app").hidden = false; $("#live").hidden = false;
  renderToolbar(); await load(true); renderTabs();
  sb.channel("jobs-live").on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, () => load(false)).subscribe();
  setInterval(() => load(false), 60000);
}
$("#loginBtn").addEventListener("click", async () => {
  $("#loginMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
  if (error) { $("#loginMsg").textContent = error.message; return; }
  location.reload();
});
$("#password").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#loginBtn").click(); });
$("#logout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
$("#langBtn").addEventListener("click", () => { lang = lang === "fr" ? "en" : "fr"; try { localStorage.setItem("ds_lang", lang); } catch {} applyText(); if (profile) { renderEditorBar(); renderToolbar(); renderStats(); renderBoard(); } });
$("#tvBtn").addEventListener("click", () => { tv = !tv; document.body.classList.toggle("tv", tv); const u = new URL(location.href); tv ? u.searchParams.set("tv", "1") : u.searchParams.delete("tv"); history.replaceState(null, "", u); });
boot();
</script>
