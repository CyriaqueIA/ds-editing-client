<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#050607"/>
  <title>DS Editing — Conditions de collaboration</title>
  <link rel="icon" type="image/png" href="assets/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#050607;--surface:#0F1114;--surface-2:#161A1F;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.22);--cream:#F5F5F1;--taupe:#9AA3AD;--amber:#DCE3EA;--amber-soft:rgba(220,227,234,.12);--ok:#46D369;--err:#F08A82;--warn:#F5C400;--blue:#7FB0E0;--accent2:#B9C9DA;--chrome:linear-gradient(180deg,#FFFFFF 0%,#E3E7EC 38%,#9BA4AE 72%,#D6DBE0 100%);--chrome2:linear-gradient(95deg,#B9C9DA 0%,#7FA3CF 45%,#E6ECF2 100%);--glass:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Geist',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
    body{background:radial-gradient(1200px 700px at 85% -5%,rgba(125,155,195,.16),transparent 60%),radial-gradient(900px 600px at -10% 40%,rgba(160,170,185,.08),transparent 60%),#050607;background-attachment:fixed}
    .mono{font-family:'Geist',system-ui,sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums;color:var(--taupe)}
    .display{font-family:'Geist',system-ui,sans-serif;font-weight:600;letter-spacing:-.035em;text-transform:none;line-height:.98;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lv-rec{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:22px;letter-spacing:-.04em;line-height:1;color:var(--cream);white-space:nowrap}
    .lv-rec i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);animation:blink 1.6s infinite;margin-right:2px}
    .lv-rec em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--taupe);margin-left:2px}
    @keyframes blink{50%{opacity:.2}}
    header{position:sticky;top:0;z-index:10;background:rgba(8,9,11,.62);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid var(--line)}.hd{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
    .hd b{font-weight:600;display:none} /* le nom est déjà porté par le logo « ● Rec » */
    .lang{margin-left:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;height:36px;padding:0 14px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;letter-spacing:-.01em;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:border-color .2s,background .2s}.lang:hover{border-color:rgba(220,230,240,.35);background:rgba(255,255,255,.08)}
    main{max-width:760px;margin:0 auto;padding:36px 16px 80px;line-height:1.6}
    h1{font-family:'Geist',system-ui,sans-serif;font-weight:600;letter-spacing:-.035em;text-transform:none;font-size:clamp(32px,6vw,50px);line-height:.98;margin:12px 0 10px;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{margin:0 0 8px;color:var(--cream)}.sub{color:var(--taupe);margin:0 0 26px}
    /* chaque condition = h2 + p, rendus en une seule carte verre 22px (le h2 porte le haut, le p le bas) */
    h2{font-family:'Geist',system-ui,sans-serif;font-weight:600;font-size:16px;letter-spacing:-.015em;line-height:1.25;margin:12px 0 0;padding:18px 22px 6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);color:var(--cream)}
    h2+p{margin:0 0 12px;padding:0 22px 18px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px;color:var(--cream)}
    a{color:var(--amber);text-decoration-color:rgba(220,227,234,.4);text-underline-offset:3px;transition:text-decoration-color .2s}a:hover{text-decoration-color:var(--amber)}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<header><div class="hd"><span class="lv-rec"><i></i>DS<em>Editing</em></span><b>DS Editing</b><button class="lang" id="langBtn" type="button">EN</button></div></header>
<main id="main"></main>
<script>
const T = {
  fr: { kicker: "Conditions de collaboration", title: "Comment on travaille ensemble", sub: "Version du 27 septembre 2026. Ces conditions s'appliquent à chaque commande passée via l'espace client DS Editing.",
    sections: [
      ["1. Le prestataire", "DS Editing est le nom commercial de Silver Ledger HK LLC, société établie à Cheyenne, Wyoming (États-Unis), Filing ID 2026-001894957. Contact : contact@ds-editing.com."],
      ["2. La commande", "Chaque envoi du formulaire de dépôt constitue une commande. Le client reçoit un numéro de suivi à 7 chiffres et un lien de suivi. Le client fournit des liens de rushes accessibles ; les fichiers restent hébergés chez lui, DS Editing ne stocke que les liens, le brief et les éléments de marque."],
      ["3. Délais", "La date souhaitée indiquée dans la commande est un objectif partagé. Le délai standard est de 5 jours ouvrés après réception des fichiers ; il peut être ajusté selon la charge et le volume. Tout retard est visible en temps réel sur la page de suivi."],
      ["4. Livraison et validation", "Chaque montage passe par le contrôle qualité DS Editing avant d'être envoyé. Le client relit et commente sur frame.io. Les ajustements raisonnables demandés dans les 5 jours suivant la livraison sont inclus ; au-delà, ou pour une nouvelle direction créative, une nouvelle commande est nécessaire."],
      ["5. Facturation hebdomadaire", "Une facture par semaine (lundi au dimanche) regroupe toutes les livraisons validées par le contrôle qualité dans la semaine. Elle est émise le dimanche à 23 h 50 (heure de Bali), envoyée par e-mail avec le PDF et disponible dans l'espace client. Pas de livraison dans la semaine, pas de facture."],
      ["6. Paiement", "Paiement à réception, par virement bancaire (coordonnées sur la facture), en indiquant le numéro de facture en référence. Un rappel automatique est envoyé 2 jours après l'envoi si la facture reste impayée."],
      ["7. Retard de paiement", "Tout retard de paiement entraîne une pénalité de 20 % par semaine de retard sur le solde dû, à compter du 3e jour suivant l'envoi de la facture. DS Editing peut suspendre les livraisons en cours tant qu'un solde reste impayé."],
      ["8. Taxes", "TVA non applicable : prestataire établi hors Union européenne. Pour un client professionnel européen, autoliquidation par le preneur (art. 283-2 du CGI). Les prix sont exprimés dans la devise du client (EUR ou USD)."],
      ["9. Propriété et usage", "Les montages livrés appartiennent au client dès le paiement complet de la facture correspondante. DS Editing peut présenter des extraits dans son portfolio, sauf demande contraire écrite du client."],
      ["10. Confidentialité", "Les rushes, briefs et informations transmis restent confidentiels et ne sont utilisés que pour réaliser la commande. Les accès sont limités à l'équipe affectée au projet."],
      ["11. Acceptation", "L'envoi d'une commande depuis l'espace client vaut acceptation de ces conditions. Elles peuvent évoluer ; la version en vigueur est celle publiée sur cette page à la date de la commande."],
    ] },
  en: { kicker: "Terms of collaboration", title: "How we work together", sub: "Version dated September 27, 2026. These terms apply to every order placed through the DS Editing client space.",
    sections: [
      ["1. The provider", "DS Editing is the trade name of Silver Ledger HK LLC, a company established in Cheyenne, Wyoming (USA), Filing ID 2026-001894957. Contact: contact@ds-editing.com."],
      ["2. The order", "Each submission of the deposit form is an order. The client receives a 7-digit tracking number and a tracking link. The client provides accessible footage links; files stay hosted on the client's side, DS Editing only stores links, the brief and brand assets."],
      ["3. Timing", "The requested date given in the order is a shared target. The standard turnaround is 5 business days after the files are received; it may be adjusted depending on workload and volume. Any delay is visible in real time on the tracking page."],
      ["4. Delivery and approval", "Every edit goes through DS Editing quality control before being sent. The client reviews and comments on frame.io. Reasonable adjustments requested within 5 days of delivery are included; beyond that, or for a new creative direction, a new order is required."],
      ["5. Weekly invoicing", "One invoice per week (Monday to Sunday) covers all deliveries approved by quality control during the week. It is issued on Sunday at 11:50 pm (Bali time), emailed with the PDF and available in the client space. No delivery during the week, no invoice."],
      ["6. Payment", "Payment is due on receipt, by bank wire (details on the invoice), referencing the invoice number. An automatic reminder is sent 2 days after the invoice is emailed if it remains unpaid."],
      ["7. Late payment", "Late payments accrue a 20% penalty per week on the outstanding balance, starting on the 3rd day after the invoice is sent. DS Editing may pause ongoing deliveries while a balance remains unpaid."],
      ["8. Taxes", "No VAT applicable: provider established outside the European Union. For EU business clients, reverse charge by the customer (art. 283-2 CGI). Prices are in the client's currency (EUR or USD)."],
      ["9. Ownership and usage", "Delivered edits belong to the client once the corresponding invoice is paid in full. DS Editing may show excerpts in its portfolio unless the client objects in writing."],
      ["10. Confidentiality", "Footage, briefs and information shared remain confidential and are used only to fulfil the order. Access is limited to the team assigned to the project."],
      ["11. Acceptance", "Submitting an order from the client space constitutes acceptance of these terms. They may evolve; the version in force is the one published on this page on the order date."],
    ] },
};
const params = new URLSearchParams(location.search); let lang = params.get("lang") || ((navigator.language || "en").slice(0, 2) === "fr" ? "fr" : "en"); if (!T[lang]) lang = "en";
function render() { const t = T[lang]; document.documentElement.lang = lang; document.title = "DS Editing — " + t.kicker; document.getElementById("langBtn").textContent = lang === "fr" ? "EN" : "FR";
  document.getElementById("main").innerHTML = `<div class="mono">${t.kicker}</div><h1>${t.title}</h1><p class="sub">${t.sub}</p>` + t.sections.map(([h, p]) => `<h2>${h}</h2><p>${p}</p>`).join(""); }
document.getElementById("langBtn").addEventListener("click", () => { lang = lang === "fr" ? "en" : "fr"; render(); }); render();
</script>
</body>
</html>
