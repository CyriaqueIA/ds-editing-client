<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#050607"/>
  <title>DS Editing — Reels & Shorts</title>
  <meta name="description" content="Extraits choisis pour accrocher dès la première seconde, sous-titres animés, sound design, format natif pour Instagram, TikTok et YouTube Shorts."/>
  <link rel="icon" type="image/png" href="../assets/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet"/>
  <link href="landing.css" rel="stylesheet"/>
</head>
<body data-service="reels-shorts">
<header class="hd-wrap"><div class="hd">
  <a class="brand" href="../index.html"><span class="lv-rec"><i></i>DS<em>Editing</em></span><span><b>DS Editing</b><small class="mono" data-ui="tagline">White-Label Studio</small></span></a>
  <nav class="hd-nav"><a href="../index.html" data-ui="back"></a><a href="../index.html#showreel" data-ui="showreel"></a></nav>
  <div class="hd-right"><button class="lang" id="langBtn" type="button">EN</button><a class="btn primary" href="#contact" data-ui="cta"></a></div>
</div></header>

<main>
  <section class="hero">
    <div class="mono" data-s="kicker"></div>
    <h1 class="display"><span data-s="title"></span><em data-s="accent"></em></h1>
    <p class="lead" data-s="lead"></p>
    <div class="hero-cta"><a class="btn primary" href="#contact" data-ui="cta"></a><span class="mono" data-ui="ctaSub"></span></div>
  </section>

  <section class="examples">
    <div class="sec-head"><span class="mono" data-ui="examples"></span></div>
    <div class="grid" id="examples"></div>
  </section>

  <section class="two">
    <div class="card">
      <div class="mono" data-ui="deliver"></div>
      <ul id="deliver"></ul>
    </div>
    <div class="card">
      <div class="mono" data-ui="process"></div>
      <ol id="steps"></ol>
    </div>
  </section>

  <section class="trust" id="trust" hidden>
    <div class="sec-head"><span class="mono" data-ui="trust"></span></div>
    <div class="studios" id="studios"></div>
  </section>

  <section class="contact card" id="contact">
    <div class="mono" data-ui="cta"></div>
    <h2 class="display" data-s="kicker"></h2>
    <form id="lead" novalidate>
      <div class="row"><input class="in" name="name" data-ph="name" required/><input class="in" name="email" type="email" data-ph="email" required/></div>
      <input class="in" name="studio" data-ph="studio"/>
      <textarea class="in" name="message" data-ph="message"></textarea>
      <div class="row-cta"><button class="btn primary" type="submit" data-ui="send"></button><a class="tp" href="https://www.trustpilot.com/review/ds-editing.com" target="_blank" rel="noopener"><i>★</i><span data-ui="trustpilot"></span></a></div>
      <div class="msg" id="msg"></div>
    </form>
  </section>

  <section class="other">
    <div class="sec-head"><span class="mono" data-ui="other"></span></div>
    <div class="chips" id="other"></div>
  </section>
</main>
<footer class="mono">DS Editing · White-label post-production · Bali</footer>

<div class="modal" id="modal"><div class="box"><div class="bar"><span id="modalTitle"></span><button type="button" id="modalClose">×</button></div><iframe id="modalFrame" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div>

<script src="../client/portfolio.js"></script>
<script src="services.js"></script>
<script src="landing.js"></script>
</body>
</html>
